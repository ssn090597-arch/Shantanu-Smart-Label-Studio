<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Warehouse Suite</title>
    <link rel="icon" type="image/png" href="logo.png.png">
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #0b132b; color: #ffffff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #1c2541; border-radius: 16px; padding: 25px 30px; width: 100%; max-width: 750px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); border: 1px solid #3a506b; text-align: center; }
        
        /* Navigation Switcher */
        .tool-switcher { display: flex; background: #0b1120; border-radius: 10px; padding: 6px; border: 1px solid #233248; margin-bottom: 20px; gap: 8px; }
        .switch-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .switch-btn.active { background: #2563eb; color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        
        .logo-container { width: 70px; height: 70px; margin: 0 auto 10px; border-radius: 50%; background: #000; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .logo-container svg { width: 45px; height: 45px; }
        
        h2 { color: #6fffe9; margin: 0 0 6px 0; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { color: #5bc0be; font-size: 13px; margin-bottom: 18px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 800; color: #cbd5e1; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        select { width: 100%; padding: 10px; background: #0b132b; border: 1px solid #3a506b; border-radius: 8px; color: #ffffff; font-size: 13px; font-weight: 600; outline: none; transition: 0.2s; }
        select:focus { border-color: #5bc0be; }
        
        .custom-file-upload { display: block; padding: 12px; background: #0b132b; color: #ffffff; border-radius: 8px; cursor: pointer; border: 1px dashed #5bc0be; font-weight: 700; font-size: 13px; transition: 0.2s; text-align: center; }
        .custom-file-upload:hover { background: #5bc0be; color: #0b132b; border-style: solid; }
        input[type="file"] { display: none; }
        
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-option { flex: 1 1 45%; background: #0b132b; border: 1px solid #3a506b; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #cbd5e1; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action, .btn-print, .btn-preview { flex: 1; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; }
        
        .btn-preview { background: #334155; color: #f8fafc; border-color: #64748b; }
        .btn-preview:hover:not(:disabled) { background: #475569; }
        
        .btn-action { background: #3a506b; color: #6fffe9; border-color: #6fffe9; }
        .btn-action:hover:not(:disabled) { background: #6fffe9; color: #0b132b; }
        
        .btn-print { background: #5bc0be; color: #0b132b; border-color: #5bc0be; }
        .btn-print:hover:not(:disabled) { background: #3a506b; color: #ffffff; }
        
        .btn-action:disabled, .btn-print:disabled, .btn-preview:disabled { background: #1c2541; color: #475569; border-color: #334155; cursor: not-allowed; opacity: 0.6; }
        
        #status { margin-top: 15px; font-size: 13px; font-weight: 700; }
        
        #previewContainer { display: none; margin-top: 20px; border: 1px solid #3a506b; border-radius: 8px; overflow: hidden; background: #0b132b; }
        #previewContainer iframe { width: 100%; height: 450px; border: none; }

        .tool-section { display: none; }
        .tool-section.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <!-- Top Switcher -->
    <div class="tool-switcher">
        <button class="switch-btn active" id="btnToolLabel" onclick="switchTool('label')">🏷️ Smart Box Label Studio</button>
        <button class="switch-btn" id="btnToolPick" onclick="switchTool('picklist')">📦 Advanced Pick List Generator</button>
    </div>

    <!-- DELHIVERY Logo Header -->
    <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="45" stroke="#ff3366" stroke-width="4"/>
            <path d="M30 65 C 30 35, 70 35, 70 65 C 70 45, 30 45, 30 65" stroke="#ffffff" stroke-width="6" fill="none"/>
            <text x="50" y="82" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DELHIVERY</text>
        </svg>
    </div>

    <!-- TOOL 1: SMART BOX LABEL STUDIO -->
    <div id="toolLabelSection" class="tool-section active">
        <h2>🏷️ Smart Box Label Studio</h2>
        <p class="subtitle">Upload Excel & Generate Outer Box Labels</p>

        <div class="form-group">
            <label for="excelFileLabel" class="custom-file-upload" id="fileLabelText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFileLabel" accept=".xlsx, .xls" onchange="handleFileLabel(this)">
        </div>

        <div class="form-group">
            <label>PRINT ORIENTATION / STICKER SIZE:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="pageOrientation" value="p"> PORTRAIT (4" X 6")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="l"> LANDSCAPE (6" X 4")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_1"> A4 (1 BOX/PAGE)</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_2" checked> A4 (2 BOXES/PAGE)</label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-preview" id="prevLabelBtn" disabled onclick="processBoxLabels('preview')">👁️ Preview PDF</button>
            <button class="btn-action" id="genLabelBtn" disabled onclick="processBoxLabels('download')">📥 Download Labels PDF</button>
            <button class="btn-print" id="printLabelBtn" disabled onclick="processBoxLabels('print')">🖨️ Print Labels Direct</button>
        </div>
    </div>

    <!-- TOOL 2: ADVANCED PICK LIST GENERATOR -->
    <div id="toolPickSection" class="tool-section">
        <h2>📦 Advanced Pick List Generator</h2>
        <p class="subtitle">Upload Excel, select filter & export/print bordered PDF.</p>

        <div class="form-group">
            <label for="excelFilePick" class="custom-file-upload" id="filePickText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFilePick" accept=".xlsx, .xls" onchange="handleFilePick(this)">
        </div>

        <div class="form-group">
            <label for="picklistSelect">PICK LIST NO SELECT KAREIN:</label>
            <select id="picklistSelect" disabled>
                <option value="ALL">-- ALL PICK LISTS --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="viewModeSelect">PICKING VIEW TYPE (PAGE BREAK MODE):</label>
            <select id="viewModeSelect">
                <option value="ITEM">ITEM Wise (Each Item on Separate Page)</option>
                <option value="BARCODE">BARCODE Wise (Each Barcode on Separate Page)</option>
                <option value="MIX">As Is / Mix (Continuous Single Document)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="binSortSelect">BIN NO SORTING ORDER:</label>
            <select id="binSortSelect">
                <option value="ASC">BIN NO: Ascending (A ➔ Z)</option>
                <option value="DESC">BIN NO: Descending (Z ➔ A)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-preview" id="prevPickBtn" disabled onclick="processPickList('preview')">👁️ Preview PDF</button>
            <button class="btn-action" id="genPickBtn" disabled onclick="processPickList('download')">📥 PDF Download</button>
            <button class="btn-print" id="printPickBtn" disabled onclick="processPickList('print')">🖨️ Direct Print</button>
        </div>
    </div>

    <div id="status"></div>

    <!-- PDF Live Preview Window -->
    <div id="previewContainer">
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<canvas id="barcodeCanvas" style="display:none;"></canvas>

<script>
    let rawSheetRowsLabel = [];
    let rawJsonDataPick = [];

    function switchTool(tool) {
        document.getElementById('btnToolLabel').classList.toggle('active', tool === 'label');
        document.getElementById('btnToolPick').classList.toggle('active', tool === 'picklist');
        
        document.getElementById('toolLabelSection').classList.toggle('active', tool === 'label');
        document.getElementById('toolPickSection').classList.toggle('active', tool === 'picklist');
        document.getElementById('status').innerText = "";
        document.getElementById('previewContainer').style.display = 'none';
    }

    function setStatus(msg, color = '#6fffe9') {
        let st = document.getElementById('status');
        st.style.color = color;
        st.innerText = msg;
    }

    // Label File Handler
    function handleFileLabel(input) {
        if (input.files.length > 0) {
            let file = input.files[0];
            document.getElementById('fileLabelText').innerText = "✓ LOADED: " + file.name.toUpperCase();
            
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    rawSheetRowsLabel = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                    document.getElementById('prevLabelBtn').disabled = false;
                    document.getElementById('genLabelBtn').disabled = false;
                    document.getElementById('printLabelBtn').disabled = false;
                    setStatus("Box Label Excel loaded successfully!", "#6fffe9");
                } catch (err) {
                    setStatus("Error reading Excel: " + err.message, "#ff6b6b");
                }
            };
            reader.readAsArrayBuffer(file);
        }
    }

    // Pick List File Handler
    function handleFilePick(input) {
        if (input.files.length > 0) {
            let file = input.files[0];
            document.getElementById('filePickText').innerText = "✓ LOADED: " + file.name.toUpperCase();
            
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    rawJsonDataPick = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    populatePicklistDropdown(rawJsonDataPick);
                    document.getElementById('picklistSelect').disabled = false;
                    document.getElementById('prevPickBtn').disabled = false;
                    document.getElementById('genPickBtn').disabled = false;
                    document.getElementById('printPickBtn').disabled = false;
                    setStatus("Pick List Excel loaded successfully!", "#6fffe9");
                } catch (err) {
                    setStatus("Error reading Excel: " + err.message, "#ff6b6b");
                }
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function populatePicklistDropdown(data) {
        let picklistSet = new Set();
        data.forEach(row => {
            let val = row["PICK LIST NO"] || row["PICK_LIST_NO"] || "";
            if (val) picklistSet.add(String(val).trim());
        });

        let select = document.getElementById('picklistSelect');
        select.innerHTML = '<option value="ALL">-- ALL PICK LISTS --</option>';
        picklistSet.forEach(pl => {
            let opt = document.createElement('option');
            opt.value = pl;
            opt.innerText = pl;
            select.appendChild(opt);
        });
    }

    // =========================================================================
    // SMART BOX LABEL STUDIO LOGIC
    // =========================================================================
    function processBoxLabels(actionType = 'download') {
        if (!rawSheetRowsLabel || rawSheetRowsLabel.length === 0) return;
        setStatus("Processing Box Data...", "#5bc0be");

        setTimeout(() => {
            try {
                let selectedOrientation = "a4_2";
                let radioElems = document.getElementsByName('pageOrientation');
                for (let r of radioElems) {
                    if (r.checked) {
                        selectedOrientation = r.value;
                        break;
                    }
                }

                let shipToVal = (rawSheetRowsLabel[0] && rawSheetRowsLabel[0][1]) ? String(rawSheetRowsLabel[0][1]).trim() : "";
                let poVal = (rawSheetRowsLabel[1] && rawSheetRowsLabel[1][1]) ? String(rawSheetRowsLabel[1][1]).trim() : "";

                let headerRowIndex = -1;
                for (let r = 0; r < Math.min(10, rawSheetRowsLabel.length); r++) {
                    let rowStr = rawSheetRowsLabel[r].join(" ").toLowerCase();
                    if (rowStr.includes("merchant sku") || rowStr.includes("challan")) {
                        headerRowIndex = r;
                        break;
                    }
                }

                if (headerRowIndex === -1) {
                    setStatus("Header row not detected in Excel!", "#ff6b6b");
                    return;
                }

                let headers = rawSheetRowsLabel[headerRowIndex].map(h => String(h).trim().toLowerCase());
                let colIdx = {
                    sku: headers.findIndex(h => h.includes("sku")),
                    challan: headers.findIndex(h => h.includes("challan")),
                    size: headers.findIndex(h => h.includes("size")),
                    itemCode: headers.findIndex(h => h.includes("item code")),
                    itemName: headers.findIndex(h => h.includes("name")),
                    color: headers.findIndex(h => h.includes("color")),
                    ean: headers.findIndex(h => h.includes("ean")),
                    qty: headers.findIndex(h => h.includes("qty")),
                    rtae: headers.findIndex(h => h.includes("rtae") || h.includes("rate")),
                    mrp: headers.findIndex(h => h.includes("mrp")),
                    boxCount: headers.findIndex(h => h.includes("box count") || h.includes("box")),
                    invNo: headers.findIndex(h => h.includes("invoice") || h.includes("inv"))
                };

                let boxesMap = new Map();

                for (let i = headerRowIndex + 1; i < rawSheetRowsLabel.length; i++) {
                    let row = rawSheetRowsLabel[i];
                    if (!row || row.length === 0) continue;

                    let boxNo = colIdx.boxCount !== -1 ? String(row[colIdx.boxCount] || '').trim() : "1";
                    if (!boxNo) continue;

                    let sku = colIdx.sku !== -1 ? String(row[colIdx.sku] || '').trim() : "";
                    let challan = colIdx.challan !== -1 ? String(row[colIdx.challan] || '').trim() : "";
                    let size = colIdx.size !== -1 ? String(row[colIdx.size] || '').trim() : "";
                    let itemCode = colIdx.itemCode !== -1 ? String(row[colIdx.itemCode] || '').trim() : "";
                    let itemName = colIdx.itemName !== -1 ? String(row[colIdx.itemName] || '').trim() : "";
                    let color = colIdx.color !== -1 ? String(row[colIdx.color] || '').trim() : "";
                    let ean = colIdx.ean !== -1 ? String(row[colIdx.ean] || '').trim() : "";
                    let qty = colIdx.qty !== -1 ? parseInt(row[colIdx.qty]) || 1 : 1;
                    let rtae = colIdx.rtae !== -1 ? String(row[colIdx.rtae] || '').trim() : "";
                    let mrp = colIdx.mrp !== -1 ? String(row[colIdx.mrp] || '').trim() : "";
                    let invNo = colIdx.invNo !== -1 ? String(row[colIdx.invNo] || '').trim() : "";

                    if (!sku && !itemCode) continue;

                    if (!boxesMap.has(boxNo)) {
                        boxesMap.set(boxNo, { boxNo, shipTo: shipToVal, poOrd: poVal, challanNo: challan, invNo, items: [] });
                    }

                    let b = boxesMap.get(boxNo);
                    if (!b.challanNo && challan) b.challanNo = challan;
                    if (!b.invNo && invNo) b.invNo = invNo;
                    b.items.push({ sku, size, itemCode, itemName, color, ean, rtae, mrp, qty });
                }

                let boxesArray = Array.from(boxesMap.values());
                let totalBoxesCount = boxesArray.length;

                if (totalBoxesCount === 0) {
                    setStatus("No Box Data Found!", "#ff6b6b");
                    return;
                }

                const { jsPDF } = window.jspdf;
                let doc;

                if (selectedOrientation === "p") {
                    doc = new jsPDF({ orientation: 'p', unit: 'mm', format: [101.6, 152.4] });
                } else if (selectedOrientation === "l") {
                    doc = new jsPDF({ orientation: 'l', unit: 'mm', format: [152.4, 101.6] });
                } else {
                    doc = new jsPDF('p', 'mm', 'a4');
                }

                // EXACT REQUESTED RENDER LABEL BOX FUNCTION
                function renderLabelBox(d, bData, x, y, width, height) {
                    d.setLineWidth(0.6);
                    d.setDrawColor(0, 0, 0);
                    d.rect(x, y, width, height);

                    let headerHeight = Math.min(26, height * 0.22);
                    d.line(x, y + headerHeight, x + width, y + headerHeight);

                    let leftColWidth = width * 0.62;
                    d.line(x + leftColWidth, y, x + leftColWidth, y + headerHeight);

                    let baseFontSize = width < 120 ? 6 : 8;
                    d.setFontSize(baseFontSize);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(0, 0, 0);

                    let hX = x + 2;
                    let hY = y + 4;
                    let stepY = (headerHeight - 4) / 4;
                    d.text(`SHIP TO / DEST: ${bData.shipTo || "-"}`, hX, hY);
                    d.text(`PO/ORD: ${bData.poOrd || "-"}`, hX, hY + stepY);
                    d.text(`CHALLAN NO: ${bData.challanNo || "-"}`, hX, hY + (stepY * 2));
                    d.text(`INV NO: ${bData.invNo || "-"}`, hX, hY + (stepY * 3));

                    // Right Column - BOX NO. & BARCODE FIX
                    let rX = x + leftColWidth + ((width - leftColWidth) / 2);
                    d.setFontSize(baseFontSize + 1);
                    d.text("BOX NO.", rX, y + 4.5, { align: "center" });

                    d.setFontSize(baseFontSize + 3);
                    d.text(`${bData.boxNo} / ${totalBoxesCount}`, rX, y + 9.5, { align: "center" });

                    // FIXED BARCODE GENERATION & PLACEMENT
                    try {
                        let canvas = document.getElementById('barcodeCanvas');
                        JsBarcode(canvas, String(bData.boxNo), { 
                            format: "CODE128", 
                            displayValue: false, 
                            margin: 0, 
                            height: 35,
                            width: 2 
                        });
                        let imgData = canvas.toDataURL('image/png');
                        
                        let bcX = x + leftColWidth + 3;
                        let bcY = y + 11;
                        let bcWidth = (width - leftColWidth) - 6;
                        let bcHeight = headerHeight - 12; // Adjusts cleanly within border

                        d.addImage(imgData, 'PNG', bcX, bcY, bcWidth, bcHeight);
                    } catch (e) {
                        console.error("Barcode Generation Error:", e);
                    }

                    // Table Data Render
                    let tableHeaders = [["Merchant SKU", "SIZE", "ITEM CODE", "ITEAM NAME", "color", "Ean code", "RTAE", "MRP", "QTY"]];
                    let tableBody = bData.items.map(i => [
                        i.sku || "-", i.size || "-", i.itemCode || "-", i.itemName || "-", i.color || "-", i.ean || "-", i.rtae || "-", i.mrp || "-", i.qty || 1
                    ]);

                    let totalQty = bData.items.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                    d.autoTable({
                        startY: y + headerHeight,
                        margin: { left: x, right: (d.internal.pageSize.width - (x + width)) },
                        head: tableHeaders,
                        body: tableBody,
                        theme: 'grid',
                        styles: { fontSize: Math.max(5, baseFontSize - 1.5), cellPadding: 1.2, halign: 'center', textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.2 },
                        headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontStyle: 'bold' },
                        tableWidth: width
                    });

                    let finalY = d.lastAutoTable.finalY;
                    let footerHeight = 7;
                    if (finalY + footerHeight <= y + height) {
                        d.rect(x, finalY, width, footerHeight);

                        d.setFontSize(baseFontSize);
                        d.setFont("helvetica", "bold");
                        d.text("TOTAL BOX QTY", x + 3, finalY + 4.5);

                        let qtyColWidth = width * 0.15;
                        d.line(x + width - qtyColWidth, finalY, x + width - qtyColWidth, finalY + footerHeight);
                        d.text(String(totalQty), x + width - (qtyColWidth / 2), finalY + 4.5, { align: "center" });
                    }
                }

                let currentIndex = 0;
                function renderNextBatch() {
                    let batchSize = 10;
                    let end = Math.min(currentIndex + batchSize, boxesArray.length);

                    for (let i = currentIndex; i < end; i++) {
                        let bData = boxesArray[i];

                        if (selectedOrientation === "p") {
                            if (i > 0) doc.addPage([101.6, 152.4], 'p');
                            renderLabelBox(doc, bData, 3, 3, 95.6, 146.4);
                        } else if (selectedOrientation === "l") {
                            if (i > 0) doc.addPage([152.4, 101.6], 'l');
                            renderLabelBox(doc, bData, 3, 3, 146.4, 95.6);
                        } else if (selectedOrientation === "a4_1") {
                            if (i > 0) doc.addPage('a4', 'p');
                            renderLabelBox(doc, bData, 10, 10, 190, 270);
                        } else {
                            let isSecondBox = (i % 2 === 1);
                            if (i > 0 && !isSecondBox) doc.addPage('a4', 'p');

                            let yPos = isSecondBox ? 148 : 8;
                            renderLabelBox(doc, bData, 10, yPos, 190, 132);
                        }
                    }

                    currentIndex = end;
                    setStatus(`Processing Labels: ${currentIndex} / ${boxesArray.length} Boxes...`, "#5bc0be");

                    if (currentIndex < boxesArray.length) {
                        setTimeout(renderNextBatch, 10);
                    } else {
                        let pdfDataUrl = doc.output('bloburl');
                        if (actionType === 'preview') {
                            document.getElementById('previewContainer').style.display = 'block';
                            document.getElementById('pdfFrame').src = pdfDataUrl;
                            setStatus(`✓ Box Labels Preview Loaded! (${totalBoxesCount} Boxes)`, "#6fffe9");
                        } else if (actionType === 'print') {
                            doc.autoPrint();
                            window.open(pdfDataUrl, '_blank');
                            setStatus("✓ Print Window Opened!", "#6fffe9");
                        } else {
                            doc.save(`Box_Labels_${selectedOrientation.toUpperCase()}_${totalBoxesCount}_Boxes.pdf`);
                            setStatus("✓ Labels PDF Downloaded!", "#6fffe9");
                        }
                    }
                }
                renderNextBatch();

            } catch (err) {
                setStatus("Error: " + err.message, "#ff6b6b");
            }
        }, 100);
    }

    // =========================================================================
    // ADVANCED PICK LIST GENERATOR
    // =========================================================================
    function processPickList(actionType = 'download') {
        if (rawJsonDataPick.length === 0) return;

        setStatus(actionType === 'print' ? "Preparing Print View..." : "PDF Generate Ho Raha Hai...", "#5bc0be");

        setTimeout(() => {
            try {
                let selectedPL = document.getElementById('picklistSelect').value;
                let viewMode = document.getElementById('viewModeSelect').value;
                let binSort = document.getElementById('binSortSelect').value;

                let filteredData = rawJsonDataPick.filter(row => {
                    if (selectedPL === "ALL") return true;
                    let val = row["PICK LIST NO"] || row["PICK_LIST_NO"] || "";
                    return String(val).trim() === selectedPL;
                });

                if (filteredData.length === 0) {
                    setStatus("Selected Pick List ka koi data nahi mila!", "#ff6b6b");
                    return;
                }

                const sortRows = (rows) => {
                    return rows.sort((a, b) => {
                        let binA = String(a.binNo).toUpperCase();
                        let binB = String(b.binNo).toUpperCase();
                        if (binSort === "ASC") {
                            return binA.localeCompare(binB, undefined, { numeric: true, sensitivity: 'base' });
                        } else {
                            return binB.localeCompare(binA, undefined, { numeric: true, sensitivity: 'base' });
                        }
                    });
                };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const tableConfig = {
                    theme: 'grid',
                    margin: { top: 25 },
                    headStyles: { 
                        fillColor: [11, 19, 43], 
                        textColor: [255, 255, 255], 
                        fontStyle: 'bold', 
                        halign: 'center',
                        lineWidth: 0.3,
                        lineColor: [0, 0, 0]
                    },
                    bodyStyles: { 
                        textColor: [0, 0, 0], 
                        fontSize: 8, 
                        cellPadding: 2.5, 
                        halign: 'center',
                        lineWidth: 0.3,
                        lineColor: [0, 0, 0]
                    },
                    footStyles: {
                        fillColor: [226, 232, 240],
                        textColor: [0, 0, 0],
                        fontStyle: 'bold',
                        fontSize: 9,
                        halign: 'center',
                        lineWidth: 0.3,
                        lineColor: [0, 0, 0]
                    },
                    columnStyles: {
                        0: { cellWidth: 35, fontStyle: 'bold' },
                        1: { cellWidth: 25 },
                        2: { cellWidth: 25 },
                        3: { cellWidth: 20 },
                        4: { cellWidth: 30 },
                        5: { cellWidth: 35, fontStyle: 'bold' },
                        6: { cellWidth: 15, fontStyle: 'bold' }
                    }
                };

                const renderCleanHeader = (mainTitle, subTitle) => {
                    doc.setFontSize(13);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(0, 0, 0);
                    doc.text(mainTitle, 14, 12);

                    doc.setFontSize(9);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(60, 60, 60);
                    doc.text(subTitle, 14, 17);
                };

                if (viewMode === "ITEM" || viewMode === "BARCODE") {
                    let groups = new Map();
                    filteredData.forEach(row => {
                        let itemKey = (viewMode === "ITEM") ? (row["ITEM"] || "UNKNOWN_ITEM") : (row["BARCODE"] || "UNKNOWN_BARCODE");
                        if (!groups.has(itemKey)) {
                            groups.set(itemKey, []);
                        }
                        groups.get(itemKey).push({
                            pickListNo: row["PICK LIST NO"] || row["PICK_LIST_NO"] || "",
                            department: row["DEPARTMENT"] || "",
                            item: row["ITEM"] || "",
                            color: row["COLOR"] || "",
                            barcode: row["BARCODE"] || "",
                            binNo: row["BIN NO"] || row["BIN_NO"] || "",
                            qty: parseFloat(row["PICK LIST QTY."] || row["PICK LIST QTY"] || row["QTY"] || 0)
                        });
                    });

                    let groupKeys = Array.from(groups.keys());

                    groupKeys.forEach((key, index) => {
                        if (index > 0) doc.addPage();

                        let itemRows = sortRows(groups.get(key));
                        let groupTotalQty = itemRows.reduce((sum, r) => sum + r.qty, 0);

                        renderCleanHeader(`PICK LIST REPORT (${selectedPL})`, `${viewMode}: ${key} | Sort: BIN NO ${binSort}`);

                        let tableBody = itemRows.map(r => [
                            r.pickListNo,
                            r.department,
                            r.item,
                            r.color,
                            r.barcode,
                            r.binNo,
                            r.qty
                        ]);

                        let tableFoot = [
                            ['TOTAL SUMMARY', '', '', '', `Lines: ${itemRows.length}`, 'TOTAL QTY:', groupTotalQty]
                        ];

                        doc.autoTable({
                            startY: 22,
                            head: [['PICK LIST NO', 'DEPARTMENT', 'ITEM', 'COLOR', 'BARCODE', 'BIN NO', 'QTY']],
                            body: tableBody,
                            foot: tableFoot,
                            ...tableConfig,
                            didDrawPage: function() {
                                renderCleanHeader(`PICK LIST REPORT (${selectedPL})`, `${viewMode}: ${key} | Sort: BIN NO ${binSort}`);
                            }
                        });
                    });

                } else {
                    let processedRows = filteredData.map(row => ({
                        pickListNo: row["PICK LIST NO"] || row["PICK_LIST_NO"] || "",
                        department: row["DEPARTMENT"] || "",
                        item: row["ITEM"] || "",
                        color: row["COLOR"] || "",
                        barcode: row["BARCODE"] || "",
                        binNo: row["BIN NO"] || row["BIN_NO"] || "",
                        qty: parseFloat(row["PICK LIST QTY."] || row["PICK LIST QTY"] || row["QTY"] || 0)
                    }));

                    processedRows = sortRows(processedRows);
                    let grandTotalQty = processedRows.reduce((sum, r) => sum + r.qty, 0);

                    renderCleanHeader(`PICK LIST REPORT (${selectedPL})`, `Mode: As Is / Mix | Sort: BIN NO ${binSort}`);

                    let tableBody = processedRows.map(r => [
                        r.pickListNo,
                        r.department,
                        r.item,
                        r.color,
                        r.barcode,
                        r.binNo,
                        r.qty
                    ]);

                    let tableFoot = [
                        ['TOTAL SUMMARY', '', '', '', `Total Items: ${processedRows.length}`, 'TOTAL QTY:', grandTotalQty]
                    ];

                    doc.autoTable({
                        startY: 22,
                        head: [['PICK LIST NO', 'DEPARTMENT', 'ITEM', 'COLOR', 'BARCODE', 'BIN NO', 'QTY']],
                        body: tableBody,
                        foot: tableFoot,
                        ...tableConfig,
                        didDrawPage: function() {
                            renderCleanHeader(`PICK LIST REPORT (${selectedPL})`, `Mode: As Is / Mix | Sort: BIN NO ${binSort}`);
                        }
                    });
                }

                let pdfDataUrl = doc.output('bloburl');

                if (actionType === 'preview') {
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('pdfFrame').src = pdfDataUrl;
                    setStatus("✓ Pick List Preview Loaded!", "#6fffe9");
                } else if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(pdfDataUrl, '_blank');
                    setStatus("✓ Print Window Opened!", "#6fffe9");
                } else {
                    doc.save(`PickList_${selectedPL}_${viewMode}_${Date.now()}.pdf`);
                    setStatus("✓ PDF with Summary Downloaded!", "#6fffe9");
                }

            } catch (err) {
                console.error(err);
                setStatus("Error: PDF process nahi ho paayi.", "#ff6b6b");
            }
        }, 100);
    }
</script>

</body>
</html>
