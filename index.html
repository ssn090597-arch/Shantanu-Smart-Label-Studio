<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Warehouse Suite (Labels & Pick List)</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); color: #ffffff; margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; }
        .card { background: #1c2541; border-radius: 12px; padding: 25px 30px; width: 100%; max-width: 600px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); border: 1px solid #3a506b; }
        h2 { color: #6fffe9; margin-top: 0; font-size: 22px; text-align: center; font-weight: 700; letter-spacing: 0.5px; }
        p.subtitle { color: #5bc0be; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        /* Main Tool Switcher Styling */
        .tool-switcher { display: flex; background: #0b132b; border-radius: 8px; padding: 5px; border: 1px solid #3a506b; margin-bottom: 20px; }
        .switch-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #cbd5e1; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .switch-btn.active { background: #5bc0be; color: #0b132b; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input[type="file"] { width: 100%; padding: 10px; background: #0b132b; border: 1px solid #3a506b; border-radius: 6px; color: #ffffff; font-size: 13px; box-sizing: border-box; }
        select:focus { outline: none; border-color: #5bc0be; }
        
        .file-input-wrapper { text-align: center; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 20px; background: #3a506b; color: #ffffff; border-radius: 6px; cursor: pointer; border: 1px solid #5bc0be; font-weight: bold; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .custom-file-upload:hover { background: #5bc0be; color: #0b132b; }
        
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-option { flex: 1 1 45%; background: #0b132b; border: 1px solid #3a506b; padding: 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
        .radio-option input { cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 12px; background: #3a506b; color: #6fffe9; border: 1px solid #6fffe9; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #6fffe9; color: #0b132b; }
        .btn-print { flex: 1; padding: 12px; background: #5bc0be; color: #0b132b; border: 1px solid #5bc0be; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-print:hover { background: #3a506b; color: #ffffff; }
        .btn-action:disabled, .btn-print:disabled { background: #1c2541; color: #475569; border-color: #334155; cursor: not-allowed; }
        
        #status { margin-top: 15px; font-size: 13px; font-weight: bold; text-align: center; }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>📦 Enterprise Warehouse Suite</h2>
    <p class="subtitle">Select your tool below, upload Excel & generate output.</p>
    
    <!-- Top Mode Switcher -->
    <div class="tool-switcher">
        <button class="switch-btn active" id="btnToolLabel" onclick="switchTool('label')">🏷️ Smart Box Label Studio</button>
        <button class="switch-btn" id="btnToolPick" onclick="switchTool('picklist')">📋 Advanced Pick List Generator</button>
    </div>

    <!-- Excel File Upload Section -->
    <div class="file-input-wrapper">
        <label for="excelFile" class="custom-file-upload" id="fileLabel">
            📄 Select Excel File (.xlsx / .xls)
        </label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <!-- TOOL 1: SMART BOX LABEL STUDIO -->
    <div id="toolLabelSection" class="tool-section active">
        <div class="form-group">
            <label>Print Orientation / Sticker Size:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="pageOrientation" value="p"> Portrait (4" x 6")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="l"> Landscape (6" x 4")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_1"> A4 (1 Box/Page)</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_2" checked> A4 (2 Boxes/Page)</label>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-action" id="generateLabelBtn" disabled onclick="processBoxLabels('download')">📥 Download Labels PDF</button>
            <button class="btn-print" id="printLabelBtn" disabled onclick="processBoxLabels('print')">🖨️ Print Labels Direct</button>
        </div>
    </div>

    <!-- TOOL 2: ADVANCED PICK LIST GENERATOR -->
    <div id="toolPickSection" class="tool-section">
        <div class="form-group">
            <label for="picklistSelect">Pick List No Filter:</label>
            <select id="picklistSelect" disabled>
                <option value="ALL">-- ALL PICK LISTS --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="viewModeSelect">Picking View Type (Page Break Mode):</label>
            <select id="viewModeSelect">
                <option value="ITEM">ITEM Wise (Each Item on Separate Page)</option>
                <option value="BARCODE">BARCODE Wise (Each Barcode on Separate Page)</option>
                <option value="MIX">As Is / Mix (Continuous Single Document)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="binSortSelect">Bin No Sorting Order:</label>
            <select id="binSortSelect">
                <option value="ASC">BIN NO: Ascending (A ➔ Z)</option>
                <option value="DESC">BIN NO: Descending (Z ➔ A)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-action" id="generatePickBtn" disabled onclick="processPickList('download')">📥 Download Picklist PDF</button>
            <button class="btn-print" id="printPickBtn" disabled onclick="processPickList('print')">🖨️ Direct Print Picklist</button>
        </div>
    </div>

    <div id="status"></div>
</div>

<canvas id="barcodeCanvas" style="display:none;"></canvas>

<script>
    let rawJsonData = [];
    let currentTool = 'label';

    function switchTool(tool) {
        currentTool = tool;
        document.getElementById('btnToolLabel').classList.toggle('active', tool === 'label');
        document.getElementById('btnToolPick').classList.toggle('active', tool === 'picklist');
        
        document.getElementById('toolLabelSection').classList.toggle('active', tool === 'label');
        document.getElementById('toolPickSection').classList.toggle('active', tool === 'picklist');
        document.getElementById('status').innerText = "";
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            let file = e.target.files[0];
            document.getElementById('fileLabel').innerText = "✓ Excel Loaded: " + file.name;
            
            let reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    let data = new Uint8Array(evt.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    rawJsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    populatePicklistDropdown(rawJsonData);
                    
                    // Enable Buttons
                    document.getElementById('generateLabelBtn').disabled = false;
                    document.getElementById('printLabelBtn').disabled = false;
                    document.getElementById('picklistSelect').disabled = false;
                    document.getElementById('generatePickBtn').disabled = false;
                    document.getElementById('printPickBtn').disabled = false;
                    
                    document.getElementById('status').style.color = '#6fffe9';
                    document.getElementById('status').innerText = "Excel file uploaded & ready!";
                } catch (err) {
                    alert("Error reading Excel File: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }
    });

    function getVal(row, keys) {
        for (let k of keys) {
            if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
                return String(row[k]).trim();
            }
        }
        return '';
    }

    function populatePicklistDropdown(data) {
        let picklistSet = new Set();
        data.forEach(row => {
            let val = getVal(row, ["PICK LIST NO", "PICK_LIST_NO"]);
            if (val) picklistSet.add(val);
        });

        let select = document.getElementById('picklistSelect');
        select.innerHTML = '<option value="ALL">-- ALL PICK LISTS --</option>';
        picklistSet.forEach(pl => {
            let opt = document.createElement('option');
            opt.value = pl;
            opt.innerText = pl;
            select.appendChild(opt);
        });
    }

    // Helper: Normalize Column Names
    function norm(str) {
        return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function getValSmart(row, possibleNames) {
        const normTargets = possibleNames.map(norm);
        for (let key in row) {
            if (normTargets.includes(norm(key))) {
                return row[key];
            }
        }
        return '';
    }

    // =========================================================================
    // CODE 1: SMART BOX LABEL GENERATOR (PROPER FULL ORIGINAL CODE)
    // =========================================================================
    function processBoxLabels(actionType = 'download') {
        if (rawJsonData.length === 0) return;

        let statusDiv = document.getElementById('status');
        statusDiv.style.color = '#5bc0be';
        statusDiv.innerText = "Generating Box Labels PDF...";

        setTimeout(() => {
            try {
                // Group by Box No
                let boxesMap = new Map();
                rawJsonData.forEach(row => {
                    let boxNo = getValSmart(row, ["BOX NO", "BOX_NO", "BOXNO", "BOX", "BOX #", "CARTON NO", "CARTON_NO"]);
                    if (!boxNo) boxNo = "1";

                    let brand = getValSmart(row, ["BRAND", "BRAND NAME", "BRAND_NAME", "MAKE", "COMPANY"]);
                    let poNo = getValSmart(row, ["PO NO", "PO_NO", "PO", "PO NUMBER", "PURCHASE ORDER", "ORDER NO"]);
                    let picklistNo = getValSmart(row, ["PICK LIST NO", "PICKLIST NO", "PICK_LIST_NO", "PICKLIST_NO", "PICKLIST", "PL NO"]);
                    let courier = getValSmart(row, ["COURIER", "COURIER NAME", "COURIER_NAME", "TRANSPORTER", "LOGISTICS"]);
                    let destination = getValSmart(row, ["DESTINATION", "DESTINATION CITY", "CITY", "TO", "SHIP TO"]);

                    let item = getValSmart(row, ["ITEM", "ITEM_NAME", "ITEM CODE", "ITEM_CODE", "STYLE", "ARTICLE", "DESCRIPTION", "PRODUCT"]);
                    let barcode = getValSmart(row, ["BARCODE", "BARCODE NO", "BARCODE_NO", "EAN", "UPC", "SKU"]);
                    let size = getValSmart(row, ["SIZE", "SZ"]);
                    let color = getValSmart(row, ["COLOR", "COLOUR", "CLR"]);
                    let qty = parseInt(getValSmart(row, ["QTY", "QUANTITY", "PICK QTY", "PCS", "PIECES"])) || 1;

                    if (!boxesMap.has(boxNo)) {
                        boxesMap.set(boxNo, {
                            boxNo: boxNo,
                            brand: brand,
                            poNo: poNo,
                            picklistNo: picklistNo,
                            courier: courier,
                            destination: destination,
                            items: []
                        });
                    }

                    let bData = boxesMap.get(boxNo);
                    if (!bData.brand && brand) bData.brand = brand;
                    if (!bData.poNo && poNo) bData.poNo = poNo;
                    if (!bData.picklistNo && picklistNo) bData.picklistNo = picklistNo;
                    if (!bData.courier && courier) bData.courier = courier;
                    if (!bData.destination && destination) bData.destination = destination;

                    bData.items.push({ item, barcode, size, color, qty });
                });

                let boxesArray = Array.from(boxesMap.values());
                let totalBoxesCount = boxesArray.length;

                const pageOrientation = document.querySelector('input[name="pageOrientation"]:checked').value;
                const { jsPDF } = window.jspdf;

                let doc;
                if (pageOrientation === 'a4_1' || pageOrientation === 'a4_2') {
                    doc = new jsPDF('p', 'mm', 'a4');
                } else {
                    doc = new jsPDF(pageOrientation, 'in', [4, 6]);
                }

                function renderLabelBox(d, x, y, width, height) {
                    d.rect(x, y, width, height);

                    // Top Header
                    d.setFillColor(15, 23, 42);
                    d.rect(x, y, width, 14, 'F');
                    d.setFontSize(14);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(255, 255, 255);
                    d.text("BOX NO: " + (it.boxNo || "-"), x + (width / 2), y + 9.5, { align: "center" });

                    // Info Grid
                    d.setFontSize(8.5);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(0, 0, 0);

                    let infoY = y + 19;
                    d.text("BRAND: " + (it.brand || "-"), x + 4, infoY);
                    d.text("PO NO: " + (it.poNo || "-"), x + (width / 2) + 2, infoY);

                    infoY += 5;
                    d.text("PICK LIST: " + (it.picklistNo || "-"), x + 4, infoY);
                    d.text("COURIER: " + (it.courier || "-"), x + (width / 2) + 2, infoY);

                    infoY += 5;
                    d.text("DESTINATION: " + (it.destination || "-"), x + 4, infoY);

                    d.setLineWidth(0.3);
                    d.line(x, infoY + 3, x + width, infoY + 3);

                    // Table Data
                    let tableBody = it.items.map(i => [
                        i.item || "-",
                        i.barcode || "-",
                        i.size || "-",
                        i.color || "-",
                        i.qty || 1
                    ]);

                    let totalPcs = it.items.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                    d.autoTable({
                        startY: infoY + 5,
                        margin: { left: x + 3, right: (d.internal.pageSize.width - (x + width)) + 3 },
                        head: [["ITEM", "BARCODE", "SIZE", "COLOR", "QTY"]],
                        body: tableBody,
                        foot: [["TOTAL PCS", "", "", "", totalPcs]],
                        theme: 'grid',
                        styles: { fontSize: 7, cellPadding: 1.5, halign: 'center', textColor: [0, 0, 0] },
                        headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
                        footStyles: { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold' },
                        tableWidth: width - 6
                    });

                    let finalY = d.lastAutoTable.finalY + 4;

                    // Barcode
                    if (it.boxNo) {
                        try {
                            let canvas = document.getElementById('barcodeCanvas');
                            JsBarcode(canvas, String(it.boxNo), { format: "CODE128", displayValue: true, fontSize: 14, margin: 0, height: 35 });
                            let imgData = canvas.toDataURL('image/png');
                            let bcWidth = Math.min(width - 20, 55);
                            let bcX = x + ((width - bcWidth) / 2);
                            d.addImage(imgData, 'PNG', bcX, finalY, bcWidth, 13);
                            finalY += 15;
                        } catch (e) { console.error(e); }
                    }

                    // Box Counter
                    d.setFontSize(8.5);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(0, 0, 0);
                    d.text(`BOX ${boxIndex + 1} OF ${totalBoxesCount}`, x + (width / 2), y + height - 3, { align: "center" });
                }

                let boxIndex = 0;
                let it = boxesArray[0];

                for (let i = 0; i < boxesArray.length; i++) {
                    boxIndex = i;
                    it = boxesArray[i];

                    if (pageOrientation === 'p' || pageOrientation === 'l') {
                        if (i > 0) doc.addPage(pageOrientation, 'in', [4, 6]);
                        let w = pageOrientation === 'p' ? 101.6 : 152.4;
                        let h = pageOrientation === 'p' ? 152.4 : 101.6;
                        renderLabelBox(doc, 2, 2, w - 4, h - 4);
                    } else if (pageOrientation === 'a4_1') {
                        if (i > 0) doc.addPage();
                        renderLabelBox(doc, 10, 10, 190, 277);
                    } else if (pageOrientation === 'a4_2') {
                        let isSecondOnPage = i % 2 !== 0;
                        if (i > 0 && !isSecondOnPage) doc.addPage();
                        let yPos = isSecondOnPage ? 148 : 10;
                        renderLabelBox(doc, 10, yPos, 190, 138);
                    }
                }

                if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(doc.output('bloburl'), '_blank');
                } else {
                    doc.save(`Box_Labels_Output.pdf`);
                }

                statusDiv.style.color = '#6fffe9';
                statusDiv.innerText = "✅ Box Labels PDF Generated!";
            } catch (err) {
                console.error(err);
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = "❌ Exception Error: " + err.message;
            }
        }, 100);
    }

    // =========================================================================
    // CODE 2: ADVANCED PICK LIST GENERATOR (PROPER FULL ORIGINAL CODE)
    // =========================================================================
    function processPickList(actionType = 'download') {
        if (rawJsonData.length === 0) return;

        let statusDiv = document.getElementById('status');
        statusDiv.style.color = '#5bc0be';
        statusDiv.innerText = actionType === 'print' ? "Preparing Print View..." : "Generating Pick List PDF...";

        setTimeout(() => {
            try {
                let selectedPL = document.getElementById('picklistSelect').value;
                let viewMode = document.getElementById('viewModeSelect').value;
                let binSort = document.getElementById('binSortSelect').value;

                let filteredData = rawJsonData.filter(row => {
                    if (selectedPL === "ALL") return true;
                    let val = getVal(row, ["PICK LIST NO", "PICK_LIST_NO"]);
                    return val === selectedPL;
                });

                if (filteredData.length === 0) {
                    statusDiv.style.color = '#ff6b6b';
                    statusDiv.innerText = "Selected Pick List ka koi data nahi mila!";
                    return;
                }

                let parsedRows = filteredData.map(row => ({
                    picklistNo: getVal(row, ["PICK LIST NO", "PICK_LIST_NO"]),
                    item: getVal(row, ["ITEM", "ITEM_NAME", "ITEM CODE", "ITEM_CODE", "STYLE"]),
                    barcode: getVal(row, ["BARCODE", "BARCODE NO", "EAN"]),
                    size: getVal(row, ["SIZE"]),
                    color: getVal(row, ["COLOR", "COLOUR"]),
                    binNo: getVal(row, ["BIN NO", "BIN_NO", "BIN", "LOCATION"]),
                    qty: parseInt(getVal(row, ["QTY", "QUANTITY", "PICK QTY"])) || 1
                }));

                const sortRows = (rows) => {
                    return rows.sort((a, b) => {
                        let binA = String(a.binNo).toUpperCase();
                        let binB = String(b.binNo).toUpperCase();
                        return binSort === "ASC"
                            ? binA.localeCompare(binB, undefined, { numeric: true, sensitivity: 'base' })
                            : binB.localeCompare(binA, undefined, { numeric: true, sensitivity: 'base' });
                    });
                };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const tableConfig = {
                    theme: 'grid',
                    margin: { top: 22 },
                    headStyles: { fillColor: [11, 19, 43], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    bodyStyles: { textColor: [0, 0, 0], fontSize: 8, cellPadding: 2.5, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    footStyles: { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: 9, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] }
                };

                const renderCleanHeader = (mainTitle, subTitle) => {
                    doc.setFontSize(13);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(0, 0, 0);
                    doc.text(mainTitle, 14, 12);

                    doc.setFontSize(9);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(60, 60, 60);
                    doc.text(subTitle, 14, 17);
                };

                let headers = [["ITEM", "BARCODE", "SIZE", "COLOR", "BIN NO", "QTY"]];

                if (viewMode === "ITEM" || viewMode === "BARCODE") {
                    let groups = new Map();
                    parsedRows.forEach(row => {
                        let key = viewMode === "ITEM" ? (row.item || 'UNKNOWN') : (row.barcode || 'UNKNOWN');
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(row);
                    });

                    let isFirstGroup = true;
                    groups.forEach((rows, groupKey) => {
                        if (!isFirstGroup) doc.addPage();
                        isFirstGroup = false;

                        let sorted = sortRows(rows);
                        let body = sorted.map(r => [r.item, r.barcode, r.size, r.color, r.binNo, r.qty]);
                        let totalQty = sorted.reduce((sum, r) => sum + r.qty, 0);

                        renderCleanHeader(`PICK LIST REPORT (${viewMode}: ${groupKey})`, `Pick List: ${selectedPL} | Items: ${sorted.length}`);

                        doc.autoTable({
                            ...tableConfig,
                            head: headers,
                            body: body,
                            foot: [["TOTAL", "", "", "", "", totalQty]]
                        });
                    });
                } else {
                    let sorted = sortRows(parsedRows);
                    let body = sorted.map(r => [r.item, r.barcode, r.size, r.color, r.binNo, r.qty]);
                    let totalQty = sorted.reduce((sum, r) => sum + r.qty, 0);

                    renderCleanHeader(`PICK LIST REPORT (MIXED VIEW)`, `Pick List: ${selectedPL} | Total Rows: ${sorted.length}`);

                    doc.autoTable({
                        ...tableConfig,
                        head: headers,
                        body: body,
                        foot: [["TOTAL", "", "", "", "", totalQty]]
                    });
                }

                if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(doc.output('bloburl'), '_blank');
                } else {
                    doc.save(`PICKLIST_${selectedPL}_${viewMode}.pdf`);
                }

                statusDiv.style.color = '#6fffe9';
                statusDiv.innerText = "✅ Pick List PDF Generated!";
            } catch (err) {
                console.error(err);
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = "❌ Exception Error: " + err.message;
            }
        }, 100);
    }
</script>
</body>
</html>
