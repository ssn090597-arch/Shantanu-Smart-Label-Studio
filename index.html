<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shantanu Delhivery Warehouse Suite</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #0f172a; color: #ffffff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #162032; border-radius: 16px; padding: 25px 30px; width: 100%; max-width: 800px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); border: 1px solid #233248; text-align: center; }
        
        /* Top Suite Selector */
        .tool-switcher { display: flex; background: #0b1120; border-radius: 10px; padding: 6px; border: 1px solid #233248; margin-bottom: 20px; }
        .switch-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .switch-btn.active { background: #2563eb; color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        
        .logo-container { width: 80px; height: 80px; margin: 0 auto 10px; border-radius: 50%; background: #000; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .logo-container svg { width: 50px; height: 50px; }
        
        h2 { color: #38bdf8; margin: 0 0 6px 0; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { color: #94a3b8; font-size: 12px; margin-bottom: 18px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 800; color: #e2e8f0; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        select { width: 100%; padding: 10px; background: #0b1120; border: 1px solid #233248; border-radius: 8px; color: #ffffff; font-size: 13px; font-weight: 600; outline: none; transition: 0.2s; }
        select:focus { border-color: #38bdf8; }
        
        .custom-file-upload { display: block; padding: 12px; background: #1e293b; color: #e2e8f0; border-radius: 8px; cursor: pointer; border: 1px dashed #38bdf8; font-weight: 700; font-size: 13px; transition: 0.2s; text-align: center; }
        .custom-file-upload:hover { background: #2563eb; color: #ffffff; border-style: solid; }
        input[type="file"] { display: none; }
        
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-option { flex: 1 1 45%; background: #0b1120; border: 1px solid #233248; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #cbd5e1; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action, .btn-print, .btn-preview { flex: 1; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; }
        .btn-action { background: #1e293b; color: #38bdf8; border-color: #38bdf8; }
        .btn-action:hover:not(:disabled) { background: #38bdf8; color: #0f172a; }
        .btn-print { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
        .btn-print:hover:not(:disabled) { background: #0369a1; }
        .btn-preview { background: #334155; color: #f8fafc; border-color: #64748b; }
        .btn-preview:hover:not(:disabled) { background: #475569; }
        
        .btn-action:disabled, .btn-print:disabled, .btn-preview:disabled { background: #0b1120; color: #475569; border-color: #1e293b; cursor: not-allowed; opacity: 0.6; }
        
        #status { margin-top: 15px; font-size: 13px; font-weight: 700; }
        
        /* Preview Frame Box */
        #previewContainer { display: none; margin-top: 20px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #0f172a; }
        #previewContainer iframe { width: 100%; height: 450px; border: none; }

        .tool-section { display: none; }
        .tool-section.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <!-- Top Mode Switcher -->
    <div class="tool-switcher">
        <button class="switch-btn active" id="btnToolLabel" onclick="switchTool('label')">🏷️ Smart Box Label Studio</button>
        <button class="switch-btn" id="btnToolPick" onclick="switchTool('picklist')">📦 Advanced Pick List Generator</button>
    </div>

    <!-- Center Logo Header -->
    <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="45" stroke="#ff3366" stroke-width="4"/>
            <path d="M30 65 C 30 35, 70 35, 70 65 C 70 45, 30 45, 30 65" stroke="#ffffff" stroke-width="6" fill="none"/>
            <text x="50" y="82" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DELHIVERY</text>
        </svg>
    </div>

    <!-- TOOL 1: SMART BOX LABEL STUDIO -->
    <div id="toolLabelSection" class="tool-section active">
        <h2>🏷️ Smart Box Label Studio</h2>
        <p class="subtitle">Upload Master Excel & Generate Standardized Outer Box Labels</p>

        <div class="form-group">
            <label for="excelFileLabel" class="custom-file-upload" id="fileLabelText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFileLabel" accept=".xlsx, .xls" onchange="handleFile(this, 'label')">
        </div>

        <div class="form-group">
            <label>Print Orientation / Page Format:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="pageOrientation" value="p"> Portrait (4" x 6")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="l"> Landscape (6" x 4")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_1"> A4 (1 Box/Page)</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_2" checked> A4 (2 Boxes/Page)</label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-preview" id="prevLabelBtn" disabled onclick="processBoxLabels('preview')">👁️ Preview PDF</button>
            <button class="btn-action" id="genLabelBtn" disabled onclick="processBoxLabels('download')">📥 PDF Download</button>
            <button class="btn-print" id="printLabelBtn" disabled onclick="processBoxLabels('print')">🖨️ Direct Print</button>
        </div>
    </div>

    <!-- TOOL 2: ADVANCED PICK LIST GENERATOR -->
    <div id="toolPickSection" class="tool-section">
        <h2>📦 Advanced Pick List Generator</h2>
        <p class="subtitle">Upload Excel, select filter & export/print bordered PDF.</p>

        <div class="form-group">
            <label for="excelFilePick" class="custom-file-upload" id="filePickText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFilePick" accept=".xlsx, .xls" onchange="handleFile(this, 'picklist')">
        </div>

        <div class="form-group">
            <label>PICK LIST NO SELECT KAREIN:</label>
            <select id="picklistSelect" disabled>
                <option value="ALL">-- ALL PICK LISTS --</option>
            </select>
        </div>

        <div class="form-group">
            <label>PICKING VIEW TYPE (PAGE BREAK MODE):</label>
            <select id="viewModeSelect">
                <option value="ITEM">ITEM Wise (Each Item on Separate Page)</option>
                <option value="BARCODE">BARCODE Wise (Each Barcode on Separate Page)</option>
                <option value="MIX">As Is / Mix (Continuous Single Document)</option>
            </select>
        </div>

        <div class="form-group">
            <label>BIN NO SORTING ORDER:</label>
            <select id="binSortSelect">
                <option value="DESC">BIN NO: Descending (Z ➔ A)</option>
                <option value="ASC">BIN NO: Ascending (A ➔ Z)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-preview" id="prevPickBtn" disabled onclick="processPickList('preview')">👁️ Preview PDF</button>
            <button class="btn-action" id="genPickBtn" disabled onclick="processPickList('download')">📥 PDF Download</button>
            <button class="btn-print" id="printPickBtn" disabled onclick="processPickList('print')">🖨️ Direct Print</button>
        </div>
    </div>

    <div id="status"></div>

    <!-- PDF Live Preview Screen -->
    <div id="previewContainer">
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<canvas id="barcodeCanvas" style="display:none;"></canvas>

<script>
    let rawSheetRows = [];
    let activeTool = 'label';

    function switchTool(tool) {
        activeTool = tool;
        document.getElementById('btnToolLabel').classList.toggle('active', tool === 'label');
        document.getElementById('btnToolPick').classList.toggle('active', tool === 'picklist');
        
        document.getElementById('toolLabelSection').classList.toggle('active', tool === 'label');
        document.getElementById('toolPickSection').classList.toggle('active', tool === 'picklist');
        document.getElementById('status').innerText = "";
        document.getElementById('previewContainer').style.display = 'none';
    }

    function setStatus(msg, color = '#38bdf8') {
        let st = document.getElementById('status');
        st.style.color = color;
        st.innerText = msg;
    }

    function handleFile(input, tool) {
        if (input.files.length > 0) {
            let file = input.files[0];
            document.getElementById(tool === 'label' ? 'fileLabelText' : 'filePickText').innerText = "✓ Loaded: " + file.name;
            
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let sheetName = workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[sheetName];
                    
                    // Parse raw 2D Array
                    rawSheetRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                    populatePicklistDropdown();

                    document.getElementById('prevLabelBtn').disabled = false;
                    document.getElementById('genLabelBtn').disabled = false;
                    document.getElementById('printLabelBtn').disabled = false;
                    
                    document.getElementById('picklistSelect').disabled = false;
                    document.getElementById('prevPickBtn').disabled = false;
                    document.getElementById('genPickBtn').disabled = false;
                    document.getElementById('printPickBtn').disabled = false;
                    
                    setStatus("Excel file loaded successfully! Data ready.", "#38bdf8");
                } catch (err) {
                    setStatus("Error reading Excel File: " + err.message, "#ff6b6b");
                }
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function populatePicklistDropdown() {
        let plSet = new Set();
        // Look for Picklist No in rows
        rawSheetRows.forEach(row => {
            row.forEach(cell => {
                let str = String(cell).trim();
                if (str.startsWith("PL") || str.startsWith("PICK")) {
                    plSet.add(str);
                }
            });
        });

        let select = document.getElementById('picklistSelect');
        select.innerHTML = '<option value="ALL">-- ALL PICK LISTS --</option>';
        plSet.forEach(pl => {
            let opt = document.createElement('option');
            opt.value = pl;
            opt.innerText = pl;
            select.appendChild(opt);
        });
    }

    // =========================================================================
    // SMART BOX LABEL GENERATOR (CHUNKED BATCHING & EXACT IMAGE PARSING)
    // =========================================================================
    function processBoxLabels(actionType = 'download') {
        if (!rawSheetRows || rawSheetRows.length === 0) return;

        setStatus("Reading Box Data & Preparing PDF...", "#38bdf8");

        setTimeout(() => {
            try {
                // Header Info Extraction
                let shipToVal = "";
                let poVal = "";

                if (rawSheetRows[0] && rawSheetRows[0][1]) shipToVal = String(rawSheetRows[0][1]).trim();
                if (rawSheetRows[1] && rawSheetRows[1][1]) poVal = String(rawSheetRows[1][1]).trim();

                // Find Header Row Index
                let headerRowIndex = -1;
                for (let r = 0; r < Math.min(10, rawSheetRows.length); r++) {
                    let rowStr = rawSheetRows[r].join(" ").toLowerCase();
                    if (rowStr.includes("merchant sku") || rowStr.includes("challan")) {
                        headerRowIndex = r;
                        break;
                    }
                }

                if (headerRowIndex === -1) {
                    setStatus("Header row not detected in Excel!", "#ff6b6b");
                    return;
                }

                // Header Mapping
                let headers = rawSheetRows[headerRowIndex].map(h => String(h).trim().toLowerCase());
                let colIdx = {
                    sku: headers.findIndex(h => h.includes("sku")),
                    challan: headers.findIndex(h => h.includes("challan")),
                    size: headers.findIndex(h => h.includes("size")),
                    itemCode: headers.findIndex(h => h.includes("item code")),
                    itemName: headers.findIndex(h => h.includes("name")),
                    color: headers.findIndex(h => h.includes("color")),
                    ean: headers.findIndex(h => h.includes("ean")),
                    qty: headers.findIndex(h => h.includes("qty")),
                    rtae: headers.findIndex(h => h.includes("rtae") || h.includes("rate")),
                    mrp: headers.findIndex(h => h.includes("mrp")),
                    boxCount: headers.findIndex(h => h.includes("box count") || h.includes("box")),
                    invNo: headers.findIndex(h => h.includes("invoice") || h.includes("inv"))
                };

                let boxesMap = new Map();

                for (let i = headerRowIndex + 1; i < rawSheetRows.length; i++) {
                    let row = rawSheetRows[i];
                    if (!row || row.length === 0) continue;

                    let boxNo = colIdx.boxCount !== -1 ? String(row[colIdx.boxCount] || '').trim() : "1";
                    if (!boxNo) continue;

                    let sku = colIdx.sku !== -1 ? String(row[colIdx.sku] || '').trim() : "";
                    let challan = colIdx.challan !== -1 ? String(row[colIdx.challan] || '').trim() : "";
                    let size = colIdx.size !== -1 ? String(row[colIdx.size] || '').trim() : "";
                    let itemCode = colIdx.itemCode !== -1 ? String(row[colIdx.itemCode] || '').trim() : "";
                    let itemName = colIdx.itemName !== -1 ? String(row[colIdx.itemName] || '').trim() : "";
                    let color = colIdx.color !== -1 ? String(row[colIdx.color] || '').trim() : "";
                    let ean = colIdx.ean !== -1 ? String(row[colIdx.ean] || '').trim() : "";
                    let qty = colIdx.qty !== -1 ? parseInt(row[colIdx.qty]) || 1 : 1;
                    let rtae = colIdx.rtae !== -1 ? String(row[colIdx.rtae] || '').trim() : "";
                    let mrp = colIdx.mrp !== -1 ? String(row[colIdx.mrp] || '').trim() : "";
                    let invNo = colIdx.invNo !== -1 ? String(row[colIdx.invNo] || '').trim() : "";

                    if (!sku && !itemCode) continue;

                    if (!boxesMap.has(boxNo)) {
                        boxesMap.set(boxNo, {
                            boxNo: boxNo,
                            shipTo: shipToVal,
                            poOrd: poVal,
                            challanNo: challan,
                            invNo: invNo,
                            items: []
                        });
                    }

                    let b = boxesMap.get(boxNo);
                    if (!b.challanNo && challan) b.challanNo = challan;
                    if (!b.invNo && invNo) b.invNo = invNo;

                    b.items.push({ sku, size, itemCode, itemName, color, ean, rtae, mrp, qty });
                }

                let boxesArray = Array.from(boxesMap.values());
                let totalBoxesCount = boxesArray.length;

                if (totalBoxesCount === 0) {
                    setStatus("No Box Data Found in File!", "#ff6b6b");
                    return;
                }

                const pageOrientation = document.querySelector('input[name="pageOrientation"]:checked').value;
                const { jsPDF } = window.jspdf;
                let doc = new jsPDF('p', 'mm', 'a4');

                function renderLabelBox(d, bData, x, y, width, height) {
                    d.setLineWidth(0.8);
                    d.setDrawColor(0, 0, 0);
                    d.rect(x, y, width, height);

                    let headerHeight = 26;
                    d.line(x, y + headerHeight, x + width, y + headerHeight);

                    let leftColWidth = width * 0.68;
                    d.line(x + leftColWidth, y, x + leftColWidth, y + headerHeight);

                    d.setFontSize(8);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(0, 0, 0);

                    let hX = x + 3;
                    let hY = y + 5;
                    d.text(`SHIP TO / DEST: ${bData.shipTo || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`PO/ORD: ${bData.poOrd || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`CHALLAN NO: ${bData.challanNo || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`INV NO: ${bData.invNo || "-"}`, hX, hY);

                    let rX = x + leftColWidth + ((width - leftColWidth) / 2);
                    d.setFontSize(10);
                    d.text("BOX NO.", rX, y + 6, { align: "center" });

                    d.setFontSize(14);
                    d.text(`${bData.boxNo} / ${totalBoxesCount}`, rX, y + 12, { align: "center" });

                    try {
                        let canvas = document.getElementById('barcodeCanvas');
                        JsBarcode(canvas, String(bData.boxNo), { format: "CODE128", displayValue: false, margin: 0, height: 30 });
                        let imgData = canvas.toDataURL('image/png');
                        d.addImage(imgData, 'PNG', x + leftColWidth + 5, y + 14, (width - leftColWidth) - 10, 10);
                    } catch (e) {}

                    let tableHeaders = [["Merchant SKU", "SIZE", "ITEM CODE", "ITEAM NAME", "color", "Ean code", "RTAE", "MRP", "QTY"]];
                    let tableBody = bData.items.map(i => [
                        i.sku || "-",
                        i.size || "-",
                        i.itemCode || "-",
                        i.itemName || "-",
                        i.color || "-",
                        i.ean || "-",
                        i.rtae || "-",
                        i.mrp || "-",
                        i.qty || 1
                    ]);

                    let totalQty = bData.items.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                    d.autoTable({
                        startY: y + headerHeight,
                        margin: { left: x, right: (d.internal.pageSize.width - (x + width)) },
                        head: tableHeaders,
                        body: tableBody,
                        theme: 'grid',
                        styles: { fontSize: 7, cellPadding: 1.8, halign: 'center', textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.3 },
                        headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontStyle: 'bold' },
                        tableWidth: width
                    });

                    let finalY = d.lastAutoTable.finalY;
                    let footerHeight = 8;
                    d.rect(x, finalY, width, footerHeight);

                    d.setFontSize(9);
                    d.setFont("helvetica", "bold");
                    d.text("TOTAL BOX QTY", x + 3, finalY + 5.5);

                    let qtyColWidth = 20;
                    d.line(x + width - qtyColWidth, finalY, x + width - qtyColWidth, finalY + footerHeight);
                    d.text(String(totalQty), x + width - (qtyColWidth / 2), finalY + 5.5, { align: "center" });
                }

                // Async Batch processing to fix Maximum Call Stack Exceeded
                let currentIndex = 0;

                function renderNextBatch() {
                    let batchSize = 10;
                    let end = Math.min(currentIndex + batchSize, boxesArray.length);

                    for (let i = currentIndex; i < end; i++) {
                        if (i > 0) doc.addPage();
                        renderLabelBox(doc, boxesArray[i], 10, 10, 190, 130);
                    }

                    currentIndex = end;
                    setStatus(`Processing Labels: ${currentIndex} / ${boxesArray.length} Boxes...`, "#38bdf8");

                    if (currentIndex < boxesArray.length) {
                        setTimeout(renderNextBatch, 10);
                    } else {
                        // Complete Output
                        let pdfDataUrl = doc.output('bloburl');

                        if (actionType === 'preview') {
                            document.getElementById('previewContainer').style.display = 'block';
                            document.getElementById('pdfFrame').src = pdfDataUrl;
                            setStatus(`✅ Preview Ready (${totalBoxesCount} Boxes)`, "#38bdf8");
                        } else if (actionType === 'print') {
                            doc.autoPrint();
                            window.open(pdfDataUrl, '_blank');
                            setStatus(`✅ Print Window Opened!`, "#38bdf8");
                        } else {
                            doc.save(`Box_Labels_Master_${totalBoxesCount}_Boxes.pdf`);
                            setStatus(`✅ PDF Downloaded Successfully!`, "#38bdf8");
                        }
                    }
                }

                renderNextBatch();

            } catch (err) {
                console.error(err);
                setStatus("❌ Processing Error: " + err.message, "#ff6b6b");
            }
        }, 100);
    }

    // =========================================================================
    // ADVANCED PICK LIST GENERATOR (PREVIEW & PRINT FIXED)
    // =========================================================================
    function processPickList(actionType = 'download') {
        if (!rawSheetRows || rawSheetRows.length === 0) return;
        setStatus("Generating Pick List PDF...", "#38bdf8");

        setTimeout(() => {
            try {
                let selectedPL = document.getElementById('picklistSelect').value;
                let viewMode = document.getElementById('viewModeSelect').value;
                let binSort = document.getElementById('binSortSelect').value;

                let parsedRows = [];
                for (let i = 1; i < rawSheetRows.length; i++) {
                    let r = rawSheetRows[i];
                    if (r && r.length > 3) {
                        parsedRows.push({
                            picklistNo: String(r[0] || 'PL-001'),
                            department: String(r[1] || 'GENERAL'),
                            item: String(r[2] || ''),
                            color: String(r[5] || ''),
                            barcode: String(r[6] || ''),
                            binNo: String(r[10] || 'BIN-01'),
                            qty: parseInt(r[7]) || 1
                        });
                    }
                }

                const sortRows = (rows) => {
                    return rows.sort((a, b) => {
                        let binA = String(a.binNo).toUpperCase();
                        let binB = String(b.binNo).toUpperCase();
                        return binSort === "ASC"
                            ? binA.localeCompare(binB, undefined, { numeric: true, sensitivity: 'base' })
                            : binB.localeCompare(binA, undefined, { numeric: true, sensitivity: 'base' });
                    });
                };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const tableConfig = {
                    theme: 'grid',
                    margin: { top: 22 },
                    headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    bodyStyles: { textColor: [0, 0, 0], fontSize: 8, cellPadding: 2.5, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    footStyles: { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: 9, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] }
                };

                let headers = [["PICK LIST NO", "DEPARTMENT", "ITEM", "COLOR", "BARCODE", "BIN NO", "PICK LIST QTY"]];
                let sorted = sortRows(parsedRows);
                let body = sorted.map(r => [r.picklistNo, r.department, r.item, r.color, r.barcode, r.binNo, r.qty]);
                let totalQty = sorted.reduce((sum, r) => sum + r.qty, 0);

                doc.setFontSize(13);
                doc.setFont("helvetica", "bold");
                doc.text(`PICK LIST REPORT`, 14, 12);

                doc.autoTable({
                    ...tableConfig,
                    head: headers,
                    body: body,
                    foot: [["TOTAL", "", "", "", "", "", totalQty]]
                });

                let pdfDataUrl = doc.output('bloburl');

                if (actionType === 'preview') {
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('pdfFrame').src = pdfDataUrl;
                    setStatus("✅ Pick List Preview Loaded!", "#38bdf8");
                } else if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(pdfDataUrl, '_blank');
                    setStatus("✅ Print Opened!", "#38bdf8");
                } else {
                    doc.save(`PICKLIST_REPORT.pdf`);
                    setStatus("✅ Pick List PDF Downloaded!", "#38bdf8");
                }
            } catch (err) {
                setStatus("❌ Picklist Error: " + err.message, "#ff6b6b");
            }
        }, 100);
    }
</script>
</body>
</html>
