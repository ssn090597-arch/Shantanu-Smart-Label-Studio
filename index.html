<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shantanu Enterprise Suite - Label & Picklist Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #f8fafc; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; border-color: #3b82f6; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl p-6 max-w-4xl w-full text-center">

    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-2xl font-extrabold text-blue-400">Shantanu Enterprise Warehouse Suite</h1>
        <p class="text-xs text-slate-400 mt-1">Box Label Generator & Pick List Generator (Unified Tool)</p>
    </div>

    <!-- Step 1: Upload File -->
    <div class="border-2 border-dashed border-blue-500/50 rounded-xl p-6 bg-slate-800/50 hover:bg-slate-800 transition-all cursor-pointer relative mb-6" id="dropArea">
        <input type="file" id="excelFile" accept=".xlsx, .xls" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        <div class="space-y-2">
            <svg class="w-10 h-10 text-blue-400 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p class="text-slate-200 font-medium text-sm" id="uploadLabel">Upload Master Excel File (.xlsx)</p>
            <p class="text-xs text-slate-400">Click or Drag & Drop File Here</p>
        </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div id="actionArea" class="hidden">
        <div class="flex justify-center gap-3 mb-6">
            <button id="tabLabelBtn" onclick="switchTab('label')" class="tab-btn active px-5 py-2.5 rounded-lg border border-slate-700 text-xs font-bold transition-all">🏷️ Box Label Mode</button>
            <button id="tabPickBtn" onclick="switchTab('picklist')" class="tab-btn px-5 py-2.5 rounded-lg border border-slate-700 text-xs font-bold transition-all">📦 Pick List Mode</button>
        </div>

        <!-- Mode 1: Box Label Options -->
        <div id="labelOptions" class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-left mb-6 space-y-3">
            <label class="block text-xs font-bold text-blue-300">📐 SELECT PRINT ORIENTATION / SIZE:</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <label class="flex items-center gap-2 p-2 bg-slate-900 rounded-lg border border-slate-700 text-xs cursor-pointer">
                    <input type="radio" name="pageOrientation" value="p" class="text-blue-600"> Portrait (4" x 6")
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900 rounded-lg border border-slate-700 text-xs cursor-pointer">
                    <input type="radio" name="pageOrientation" value="l" class="text-blue-600"> Landscape (6" x 4")
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900 rounded-lg border border-slate-700 text-xs cursor-pointer">
                    <input type="radio" name="pageOrientation" value="a4_1" class="text-blue-600"> A4 (1 Box/Page)
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900 rounded-lg border border-slate-700 text-xs cursor-pointer">
                    <input type="radio" name="pageOrientation" value="a4_2" checked class="text-blue-600"> A4 (2 Boxes/Page)
                </label>
            </div>
            <button onclick="processBoxLabels('download')" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-lg text-xs mt-2 transition-all">📥 Generate & Download Box Labels</button>
        </div>

        <!-- Mode 2: Pick List Options -->
        <div id="picklistOptions" class="hidden bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-left mb-6 space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <div>
                    <label class="block font-bold text-blue-300 mb-1">Pick List No Filter:</label>
                    <select id="picklistSelect" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200"><option value="ALL">-- ALL PICK LISTS --</option></select>
                </div>
                <div>
                    <label class="block font-bold text-blue-300 mb-1">View Mode:</label>
                    <select id="viewModeSelect" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                        <option value="ITEM">ITEM Wise Break</option>
                        <option value="BARCODE">BARCODE Wise Break</option>
                        <option value="MIX">Mix Continuous View</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-blue-300 mb-1">Bin Sorting:</label>
                    <select id="binSortSelect" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                        <option value="ASC">BIN NO: Ascending (A-Z)</option>
                        <option value="DESC">BIN NO: Descending (Z-A)</option>
                    </select>
                </div>
            </div>
            <button onclick="processPicklist('download')" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-xs mt-2 transition-all">📥 Generate & Download Pick List</button>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="text-xs font-semibold text-blue-400 min-h-[20px]"></div>
</div>

<canvas id="barcodeCanvas" class="hidden"></canvas>

<script>
    const { jsPDF } = window.jspdf;
    let rawExcelJson = [];
    let activeTab = 'label';

    document.getElementById('excelFile').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;

        document.getElementById('uploadLabel').innerText = "✓ File Loaded: " + file.name;
        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let data = new Uint8Array(evt.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                rawExcelJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                populatePicklists(rawExcelJson);
                document.getElementById('actionArea').classList.remove('hidden');
                setStatus("✅ File ready. Select mode to generate document.", "text-emerald-400");
            } catch (err) {
                setStatus("❌ Error reading Excel file.", "text-rose-400");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function switchTab(tab) {
        activeTab = tab;
        document.getElementById('tabLabelBtn').classList.toggle('active', tab === 'label');
        document.getElementById('tabPickBtn').classList.toggle('active', tab === 'picklist');
        document.getElementById('labelOptions').classList.toggle('hidden', tab !== 'label');
        document.getElementById('picklistOptions').classList.toggle('hidden', tab !== 'picklist');
    }

    function populatePicklists(data) {
        let plSet = new Set();
        data.forEach(row => {
            let val = row["PICK LIST NO"] || row["PICK_LIST_NO"] || "";
            if (val) plSet.add(String(val).trim());
        });

        let select = document.getElementById('picklistSelect');
        select.innerHTML = '<option value="ALL">-- ALL PICK LISTS --</option>';
        plSet.forEach(pl => select.innerHTML += `<option value="${pl}">${pl}</option>`);
    }

    function norm(str) {
        return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function setStatus(msg, col = 'text-blue-400') {
        let st = document.getElementById('status');
        st.className = `text-xs font-semibold ${col}`;
        st.innerText = msg;
    }

    // ---------------- BOX LABEL LOGIC ----------------
    function processBoxLabels(action) {
        if (rawExcelJson.length === 0) return;
        setStatus("⚙️ Generating Box Labels...");

        setTimeout(() => {
            try {
                const doc = new jsPDF('p', 'mm', 'a4');
                doc.setFontSize(14);
                doc.text("Box Label Output Generated", 20, 20);
                doc.setFontSize(10);
                doc.text(`Total Records Processed: ${rawExcelJson.length}`, 20, 30);
                
                doc.save("Box_Labels.pdf");
                setStatus("✅ Labels Generated Successfully!", "text-emerald-400");
            } catch (e) {
                setStatus("❌ Error generating labels: " + e.message, "text-rose-400");
            }
        }, 100);
    }

    // ---------------- PICK LIST LOGIC ----------------
    function processPicklist(action) {
        if (rawExcelJson.length === 0) return;
        setStatus("⚙️ Generating Pick List PDF...");

        setTimeout(() => {
            try {
                let selectedPL = document.getElementById('picklistSelect').value;
                let viewMode = document.getElementById('viewModeSelect').value;
                let binSort = document.getElementById('binSortSelect').value;

                let filtered = rawExcelJson.filter(row => {
                    if (selectedPL === "ALL") return true;
                    let val = row["PICK LIST NO"] || row["PICK_LIST_NO"] || "";
                    return String(val).trim() === selectedPL;
                });

                const doc = new jsPDF('p', 'mm', 'a4');
                let headers = [["ITEM", "BARCODE", "SIZE", "COLOR", "BIN NO", "QTY"]];
                
                let body = filtered.map(r => [
                    r["ITEM"] || r["STYLE"] || "-",
                    r["BARCODE"] || "-",
                    r["SIZE"] || "-",
                    r["COLOR"] || "-",
                    r["BIN NO"] || r["BIN"] || "-",
                    r["QTY"] || 1
                ]);

                doc.autoTable({ head: headers, body: body, theme: 'grid' });
                doc.save(`Picklist_${selectedPL}.pdf`);
                setStatus("✅ Pick List Exported Successfully!", "text-emerald-400");
            } catch (e) {
                setStatus("❌ Error generating picklist: " + e.message, "text-rose-400");
            }
        }, 100);
    }
</script>
</body>
</html>
