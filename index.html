<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shantanu Delhivery Warehouse Suite</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #0f172a; color: #ffffff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #162032; border-radius: 16px; padding: 30px 35px; width: 100%; max-width: 650px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); border: 1px solid #233248; text-align: center; }
        
        /* Top Suite Selector */
        .tool-switcher { display: flex; background: #0b1120; border-radius: 10px; padding: 6px; border: 1px solid #233248; margin-bottom: 25px; }
        .switch-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .switch-btn.active { background: #2563eb; color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        
        .logo-container { width: 100px; height: 100px; margin: 0 auto 15px; border-radius: 50%; background: #000; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        h2 { color: #38bdf8; margin: 0 0 8px 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 22px; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 800; color: #e2e8f0; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        select { width: 100%; padding: 12px; background: #0b1120; border: 1px solid #233248; border-radius: 8px; color: #ffffff; font-size: 13px; font-weight: 600; outline: none; transition: 0.2s; }
        select:focus { border-color: #38bdf8; }
        
        .custom-file-upload { display: block; padding: 14px; background: #1e293b; color: #e2e8f0; border-radius: 8px; cursor: pointer; border: 1px dashed #38bdf8; font-weight: 700; font-size: 13px; transition: 0.2s; text-align: center; }
        .custom-file-upload:hover { background: #2563eb; color: #ffffff; border-style: solid; }
        input[type="file"] { display: none; }
        
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-option { flex: 1 1 45%; background: #0b1120; border: 1px solid #233248; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #cbd5e1; }

        .btn-group { display: flex; gap: 12px; margin-top: 22px; }
        .btn-action, .btn-print { flex: 1; padding: 13px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; }
        .btn-action { background: #1e293b; color: #38bdf8; border-color: #38bdf8; }
        .btn-action:hover:not(:disabled) { background: #38bdf8; color: #0f172a; }
        .btn-print { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
        .btn-print:hover:not(:disabled) { background: #0369a1; }
        .btn-action:disabled, .btn-print:disabled { background: #0b1120; color: #475569; border-color: #1e293b; cursor: not-allowed; opacity: 0.6; }
        
        #status { margin-top: 18px; font-size: 13px; font-weight: 700; }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <!-- Top Mode Switcher -->
    <div class="tool-switcher">
        <button class="switch-btn active" id="btnToolLabel" onclick="switchTool('label')">🏷️ Smart Box Label Studio</button>
        <button class="switch-btn" id="btnToolPick" onclick="switchTool('picklist')">📦 Advanced Pick List Generator</button>
    </div>

    <!-- Center Logo Header -->
    <div class="logo-container">
        <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="45" stroke="#ff3366" stroke-width="4"/>
            <path d="M30 65 C 30 35, 70 35, 70 65 C 70 45, 30 45, 30 65" stroke="#ffffff" stroke-width="6" fill="none"/>
            <text x="50" y="82" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DELHIVERY</text>
        </svg>
    </div>

    <!-- TOOL 1: SMART BOX LABEL STUDIO -->
    <div id="toolLabelSection" class="tool-section active">
        <h2>🏷️ Smart Box Label Studio</h2>
        <p class="subtitle">Upload Master Excel & Generate Standardized Outer Box Labels</p>

        <div class="form-group">
            <label for="excelFileLabel" class="custom-file-upload" id="fileLabelText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFileLabel" accept=".xlsx, .xls" onchange="handleFile(this, 'label')">
        </div>

        <div class="form-group">
            <label>Print Orientation / Page Format:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="pageOrientation" value="p"> Portrait (4" x 6")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="l"> Landscape (6" x 4")</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_1"> A4 (1 Box/Page)</label>
                <label class="radio-option"><input type="radio" name="pageOrientation" value="a4_2" checked> A4 (2 Boxes/Page)</label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-action" id="genLabelBtn" disabled onclick="processBoxLabels('download')">📥 PDF Download</button>
            <button class="btn-print" id="printLabelBtn" disabled onclick="processBoxLabels('print')">🖨️ Direct Print</button>
        </div>
    </div>

    <!-- TOOL 2: ADVANCED PICK LIST GENERATOR -->
    <div id="toolPickSection" class="tool-section">
        <h2>📦 Advanced Pick List Generator</h2>
        <p class="subtitle">Upload Excel, select filter & export/print bordered PDF.</p>

        <div class="form-group">
            <label for="excelFilePick" class="custom-file-upload" id="filePickText">
                📄 SELECT EXCEL FILE
            </label>
            <input type="file" id="excelFilePick" accept=".xlsx, .xls" onchange="handleFile(this, 'picklist')">
        </div>

        <div class="form-group">
            <label>PICK LIST NO SELECT KAREIN:</label>
            <select id="picklistSelect" disabled>
                <option value="ALL">-- ALL PICK LISTS --</option>
            </select>
        </div>

        <div class="form-group">
            <label>PICKING VIEW TYPE (PAGE BREAK MODE):</label>
            <select id="viewModeSelect">
                <option value="ITEM">ITEM Wise (Each Item on Separate Page)</option>
                <option value="BARCODE">BARCODE Wise (Each Barcode on Separate Page)</option>
                <option value="MIX">As Is / Mix (Continuous Single Document)</option>
            </select>
        </div>

        <div class="form-group">
            <label>BIN NO SORTING ORDER:</label>
            <select id="binSortSelect">
                <option value="DESC">BIN NO: Descending (Z ➔ A)</option>
                <option value="ASC">BIN NO: Ascending (A ➔ Z)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-action" id="genPickBtn" disabled onclick="processPickList('download')">📥 PDF Download</button>
            <button class="btn-print" id="printPickBtn" disabled onclick="processPickList('print')">🖨️ Direct Print</button>
        </div>
    </div>

    <div id="status"></div>
</div>

<canvas id="barcodeCanvas" style="display:none;"></canvas>

<script>
    let rawJsonData = [];
    let activeTool = 'label';

    function switchTool(tool) {
        activeTool = tool;
        document.getElementById('btnToolLabel').classList.toggle('active', tool === 'label');
        document.getElementById('btnToolPick').classList.toggle('active', tool === 'picklist');
        
        document.getElementById('toolLabelSection').classList.toggle('active', tool === 'label');
        document.getElementById('toolPickSection').classList.toggle('active', tool === 'picklist');
        document.getElementById('status').innerText = "";
    }

    function handleFile(input, tool) {
        if (input.files.length > 0) {
            let file = input.files[0];
            document.getElementById(tool === 'label' ? 'fileLabelText' : 'filePickText').innerText = "✓ Loaded: " + file.name;
            
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    rawJsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    populatePicklistDropdown(rawJsonData);
                    
                    document.getElementById('genLabelBtn').disabled = false;
                    document.getElementById('printLabelBtn').disabled = false;
                    document.getElementById('picklistSelect').disabled = false;
                    document.getElementById('genPickBtn').disabled = false;
                    document.getElementById('printPickBtn').disabled = false;
                    
                    setStatus("Excel file loaded successfully!", "#38bdf8");
                } catch (err) {
                    setStatus("Error reading Excel File: " + err.message, "#ff6b6b");
                }
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function norm(str) {
        return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function getValSmart(row, possibleNames) {
        const normTargets = possibleNames.map(norm);
        for (let key in row) {
            if (normTargets.includes(norm(key))) {
                return String(row[key]).trim();
            }
        }
        return '';
    }

    function setStatus(msg, color = '#38bdf8') {
        let st = document.getElementById('status');
        st.style.color = color;
        st.innerText = msg;
    }

    function populatePicklistDropdown(data) {
        let plSet = new Set();
        data.forEach(row => {
            let val = getValSmart(row, ["PICK LIST NO", "PICK_LIST_NO", "PICKLIST NO", "PICKLIST_NO"]);
            if (val) plSet.add(val);
        });

        let select = document.getElementById('picklistSelect');
        select.innerHTML = '<option value="ALL">-- ALL PICK LISTS --</option>';
        plSet.forEach(pl => {
            let opt = document.createElement('option');
            opt.value = pl;
            opt.innerText = pl;
            select.appendChild(opt);
        });
    }

    // =========================================================================
    // 1. SMART BOX LABEL GENERATOR (MATCHING IMAGE EXACTLY)
    // =========================================================================
    function processBoxLabels(actionType = 'download') {
        if (rawJsonData.length === 0) return;
        setStatus("Generating Box Labels PDF...");

        setTimeout(() => {
            try {
                let boxesMap = new Map();

                rawJsonData.forEach(row => {
                    let boxNo = getValSmart(row, ["BOX NO", "BOX_NO", "BOXNO", "BOX", "BOX #", "CARTON NO", "CARTON_NO"]);
                    if (!boxNo) boxNo = "1";

                    let shipTo = getValSmart(row, ["SHIP TO", "SHIP TO / DEST", "DESTINATION", "SHIP_TO", "BUYER"]);
                    let poOrd = getValSmart(row, ["PO/ORD", "PO NO", "PO_NO", "ORDER NO", "PO NUMBER"]);
                    let challanNo = getValSmart(row, ["CHALLAN NO", "CHALLAN_NO", "CHALLAN"]);
                    let invNo = getValSmart(row, ["INV NO", "INV_NO", "INVOICE NO", "INVOICE"]);

                    let merchantSku = getValSmart(row, ["Merchant SKU", "MERCHANT SKU", "SKU", "MERCHANTSKU"]);
                    let size = getValSmart(row, ["SIZE", "SZ"]);
                    let itemCode = getValSmart(row, ["ITEM CODE", "ITEM_CODE", "STYLE"]);
                    let itemName = getValSmart(row, ["ITEAM NAME", "ITEM NAME", "ITEM_NAME", "DESCRIPTION"]);
                    let color = getValSmart(row, ["color", "COLOR", "COLOUR"]);
                    let eanCode = getValSmart(row, ["Ean code", "EAN CODE", "BARCODE", "EAN"]);
                    let rtae = getValSmart(row, ["RTAE", "RATE", "PRICE"]);
                    let mrp = getValSmart(row, ["MRP"]);
                    let qty = parseInt(getValSmart(row, ["QTY", "QUANTITY", "PCS"])) || 1;

                    if (!boxesMap.has(boxNo)) {
                        boxesMap.set(boxNo, {
                            boxNo: boxNo,
                            shipTo: shipTo,
                            poOrd: poOrd,
                            challanNo: challanNo,
                            invNo: invNo,
                            items: []
                        });
                    }

                    let bData = boxesMap.get(boxNo);
                    if (!bData.shipTo && shipTo) bData.shipTo = shipTo;
                    if (!bData.poOrd && poOrd) bData.poOrd = poOrd;
                    if (!bData.challanNo && challanNo) bData.challanNo = challanNo;
                    if (!bData.invNo && invNo) bData.invNo = invNo;

                    bData.items.push({ merchantSku, size, itemCode, itemName, color, eanCode, rtae, mrp, qty });
                });

                let boxesArray = Array.from(boxesMap.values());
                let totalBoxesCount = boxesArray.length;

                const pageOrientation = document.querySelector('input[name="pageOrientation"]:checked').value;
                const { jsPDF } = window.jspdf;

                let doc = new jsPDF('p', 'mm', 'a4');

                function renderLabelBox(d, bData, index, x, y, width, height) {
                    // Outer Border
                    d.setLineWidth(0.8);
                    d.setDrawColor(0, 0, 0);
                    d.rect(x, y, width, height);

                    // Header Partition Line
                    let headerHeight = 26;
                    d.line(x, y + headerHeight, x + width, y + headerHeight);

                    // Header Middle Vertical Divider
                    let leftColWidth = width * 0.68;
                    d.line(x + leftColWidth, y, x + leftColWidth, y + headerHeight);

                    // --- Left Header Info ---
                    d.setFontSize(8);
                    d.setFont("helvetica", "bold");
                    d.setTextColor(0, 0, 0);

                    let hX = x + 3;
                    let hY = y + 5;
                    d.text(`SHIP TO / DEST: ${bData.shipTo || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`PO/ORD: ${bData.poOrd || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`CHALLAN NO: ${bData.challanNo || "-"}`, hX, hY);
                    hY += 5;
                    d.text(`INV NO: ${bData.invNo || "-"}`, hX, hY);

                    // --- Right Header (BOX NO & BARCODE) ---
                    let rX = x + leftColWidth + ((width - leftColWidth) / 2);
                    d.setFontSize(10);
                    d.text("BOX NO.", rX, y + 6, { align: "center" });

                    d.setFontSize(14);
                    d.text(`${bData.boxNo} / ${totalBoxesCount}`, rX, y + 12, { align: "center" });

                    // Generate Barcode
                    try {
                        let canvas = document.getElementById('barcodeCanvas');
                        JsBarcode(canvas, String(bData.boxNo), { format: "CODE128", displayValue: false, margin: 0, height: 30 });
                        let imgData = canvas.toDataURL('image/png');
                        d.addImage(imgData, 'PNG', x + leftColWidth + 5, y + 14, (width - leftColWidth) - 10, 10);
                    } catch (e) {}

                    // --- Item Table ---
                    let tableHeaders = [["Merchant SKU", "SIZE", "ITEM CODE", "ITEAM NAME", "color", "Ean code", "RTAE", "MRP", "QTY"]];
                    let tableBody = bData.items.map(i => [
                        i.merchantSku || "-",
                        i.size || "-",
                        i.itemCode || "-",
                        i.itemName || "-",
                        i.color || "-",
                        i.eanCode || "-",
                        i.rtae || "-",
                        i.mrp || "-",
                        i.qty || 1
                    ]);

                    let totalQty = bData.items.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                    d.autoTable({
                        startY: y + headerHeight,
                        margin: { left: x, right: (d.internal.pageSize.width - (x + width)) },
                        head: tableHeaders,
                        body: tableBody,
                        theme: 'grid',
                        styles: {
                            fontSize: 7,
                            cellPadding: 2,
                            halign: 'center',
                            textColor: [0, 0, 0],
                            lineColor: [0, 0, 0],
                            lineWidth: 0.3
                        },
                        headStyles: {
                            fillColor: [0, 0, 0],
                            textColor: [255, 255, 255],
                            fontStyle: 'bold'
                        },
                        tableWidth: width
                    });

                    // --- Total Box Qty Row ---
                    let finalY = d.lastAutoTable.finalY;
                    let footerHeight = 8;
                    d.rect(x, finalY, width, footerHeight);

                    d.setFontSize(9);
                    d.setFont("helvetica", "bold");
                    d.text("TOTAL BOX QTY", x + 3, finalY + 5.5);

                    let qtyColWidth = 20;
                    d.line(x + width - qtyColWidth, finalY, x + width - qtyColWidth, finalY + footerHeight);
                    d.text(String(totalQty), x + width - (qtyColWidth / 2), finalY + 5.5, { align: "center" });
                }

                for (let i = 0; i < boxesArray.length; i++) {
                    if (i > 0) doc.addPage();
                    renderLabelBox(doc, boxesArray[i], i, 10, 10, 190, 130);
                }

                if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(doc.output('bloburl'), '_blank');
                } else {
                    doc.save(`Box_Labels_Output.pdf`);
                }

                setStatus("✅ Box Labels PDF Generated!", "#38bdf8");
            } catch (err) {
                setStatus("❌ Error: " + err.message, "#ff6b6b");
            }
        }, 100);
    }

    // =========================================================================
    // 2. ADVANCED PICK LIST GENERATOR (MATCHING IMAGE EXACTLY)
    // =========================================================================
    function processPickList(actionType = 'download') {
        if (rawJsonData.length === 0) return;
        setStatus("Generating Pick List PDF...");

        setTimeout(() => {
            try {
                let selectedPL = document.getElementById('picklistSelect').value;
                let viewMode = document.getElementById('viewModeSelect').value;
                let binSort = document.getElementById('binSortSelect').value;

                let filteredData = rawJsonData.filter(row => {
                    if (selectedPL === "ALL") return true;
                    let val = getValSmart(row, ["PICK LIST NO", "PICK_LIST_NO", "PICKLIST NO", "PICKLIST_NO"]);
                    return val === selectedPL;
                });

                if (filteredData.length === 0) {
                    setStatus("Selected Pick List ka koi data nahi mila!", "#ff6b6b");
                    return;
                }

                let parsedRows = filteredData.map(row => ({
                    picklistNo: getValSmart(row, ["PICK LIST NO", "PICK_LIST_NO", "PICKLIST NO", "PICKLIST_NO"]),
                    department: getValSmart(row, ["DEPARTMENT", "DEPT", "CAT"]),
                    item: getValSmart(row, ["ITEM", "ITEM_NAME", "ITEM CODE", "STYLE"]),
                    color: getValSmart(row, ["COLOR", "COLOUR"]),
                    barcode: getValSmart(row, ["BARCODE", "BARCODE NO", "EAN"]),
                    binNo: getValSmart(row, ["BIN NO", "BIN_NO", "BIN", "LOCATION"]),
                    qty: parseInt(getValSmart(row, ["PICK LIST QTY", "PICK_LIST_QTY", "QTY", "QUANTITY"])) || 1
                }));

                const sortRows = (rows) => {
                    return rows.sort((a, b) => {
                        let binA = String(a.binNo).toUpperCase();
                        let binB = String(b.binNo).toUpperCase();
                        return binSort === "ASC"
                            ? binA.localeCompare(binB, undefined, { numeric: true, sensitivity: 'base' })
                            : binB.localeCompare(binA, undefined, { numeric: true, sensitivity: 'base' });
                    });
                };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const tableConfig = {
                    theme: 'grid',
                    margin: { top: 22 },
                    headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    bodyStyles: { textColor: [0, 0, 0], fontSize: 8, cellPadding: 2.5, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] },
                    footStyles: { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: 9, halign: 'center', lineWidth: 0.3, lineColor: [0, 0, 0] }
                };

                const renderCleanHeader = (mainTitle, subTitle) => {
                    doc.setFontSize(13);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(0, 0, 0);
                    doc.text(mainTitle, 14, 12);

                    doc.setFontSize(9);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(60, 60, 60);
                    doc.text(subTitle, 14, 17);
                };

                let headers = [["PICK LIST NO", "DEPARTMENT", "ITEM", "COLOR", "BARCODE", "BIN NO", "PICK LIST QTY"]];

                if (viewMode === "ITEM" || viewMode === "BARCODE") {
                    let groups = new Map();
                    parsedRows.forEach(row => {
                        let key = viewMode === "ITEM" ? (row.item || 'UNKNOWN') : (row.barcode || 'UNKNOWN');
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(row);
                    });

                    let isFirstGroup = true;
                    groups.forEach((rows, groupKey) => {
                        if (!isFirstGroup) doc.addPage();
                        isFirstGroup = false;

                        let sorted = sortRows(rows);
                        let body = sorted.map(r => [r.picklistNo, r.department, r.item, r.color, r.barcode, r.binNo, r.qty]);
                        let totalQty = sorted.reduce((sum, r) => sum + r.qty, 0);

                        renderCleanHeader(`PICK LIST REPORT (${viewMode}: ${groupKey})`, `Pick List: ${selectedPL} | Items: ${sorted.length}`);

                        doc.autoTable({
                            ...tableConfig,
                            head: headers,
                            body: body,
                            foot: [["TOTAL", "", "", "", "", "", totalQty]]
                        });
                    });
                } else {
                    let sorted = sortRows(parsedRows);
                    let body = sorted.map(r => [r.picklistNo, r.department, r.item, r.color, r.barcode, r.binNo, r.qty]);
                    let totalQty = sorted.reduce((sum, r) => sum + r.qty, 0);

                    renderCleanHeader(`PICK LIST REPORT (MIXED VIEW)`, `Pick List: ${selectedPL} | Total Rows: ${sorted.length}`);

                    doc.autoTable({
                        ...tableConfig,
                        head: headers,
                        body: body,
                        foot: [["TOTAL", "", "", "", "", "", totalQty]]
                    });
                }

                if (actionType === 'print') {
                    doc.autoPrint();
                    window.open(doc.output('bloburl'), '_blank');
                } else {
                    doc.save(`PICKLIST_${selectedPL}_${viewMode}.pdf`);
                }

                setStatus("✅ Pick List PDF Generated!", "#38bdf8");
            } catch (err) {
                setStatus("❌ Error: " + err.message, "#ff6b6b");
            }
        }, 100);
    }
</script>
</body>
</html>
