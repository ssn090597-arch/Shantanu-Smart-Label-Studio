<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Search Optimization (SEO) -->
<title>Shantanu Smart Label Studio - 4x6 Box Label Generator</title>
<meta name="description" content="Official Shantanu Smart Label Studio tool for fast 4x6 enterprise box label generation, PDF exports, and upload history tracking.">
<meta name="keywords" content="Shantanu Box Label, Shantanu Smart Label Studio, Box Label Generator, 4x6 Label Printing">
<meta name="author" content="Shantanu Mathura">
<!-- Favicon / Logo -->
<link rel="icon" type="image/jpeg" href="WhatsApp Image 2026-08-08 at 4.16.14 AM (1).jpeg">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- XLSX Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- jsPDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- jsPDF AutoTable Plugin -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="bg-white shadow-2xl rounded-2xl p-8 max-w-2xl w-full border border-gray-100 text-center">
<!-- Header with Custom Uploaded Logo -->
<div class="mb-6 flex flex-col items-center justify-center gap-2">
<img src="WhatsApp Image 2026-08-08 at 4.16.14 AM (1).jpeg" alt="Shantanu Logo" class="w-20 h-20 object-contain mb-1 drop-shadow-md rounded-lg" onerror="this.style.display='none'">
<h1 class="text-3xl font-extrabold text-gray-800 flex items-center justify-center gap-2">
<span>Shantanu Smart Label Studio</span>
</h1>
<p class="text-sm text-gray-500">v4.0 Enterprise 4x6 Dynamic Multi-Page Engine</p>
</div>

<!-- Print Orientation Selector Option -->
<div class="mb-5 bg-gray-50 border border-gray-200 rounded-xl p-4 text-left">
<label class="block text-xs font-bold text-gray-700 mb-2">📐 SELECT PRINT ORIENTATION:</label>
<div class="flex items-center gap-6">
<label class="flex items-center gap-2 cursor-pointer">
<input type="radio" name="pageOrientation" value="p" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
<span class="text-sm font-semibold text-gray-800">📱 Portrait (4" x 6")</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input type="radio" name="pageOrientation" value="l" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
<span class="text-sm font-semibold text-gray-800">🖥️ Landscape (6" x 4")</span>
</label>
</div>
</div>

<!-- File Upload Area -->
<div class="border-2 border-dashed border-blue-400 rounded-xl p-8 bg-blue-50/50 hover:bg-blue-50 transition-all cursor-pointer relative" id="dropArea">
<input type="file" id="excelFile" accept=".xlsx, .xls" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
<div class="space-y-3">
<svg class="w-12 h-12 text-blue-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
</svg>
<p class="text-gray-700 font-medium text-lg">Upload Your Excel File (.xlsx)</p>
<p class="text-xs text-gray-400">Click or Drag & Drop File Here</p>
</div>
</div>

<!-- Detected Headers Info Box -->
<div id="debugBox" class="mt-4 p-3 bg-gray-100 border border-gray-300 rounded-lg text-left text-xs text-gray-700 hidden overflow-x-auto">
<p class="font-bold mb-1">🔍 Detected Columns in Excel:</p>
<p id="detectedColsText" class="font-mono text-blue-800"></p>
</div>

<!-- Status Message -->
<div id="status" class="mt-6 text-sm font-semibold hidden"></div>

<!-- Result Stats & Download Button -->
<div id="resultBox" class="mt-6 hidden bg-green-50 border border-green-200 rounded-xl p-5 space-y-4">
<div class="flex justify-between items-center text-green-800">
<span class="font-bold text-base">Total Active Boxes Generated:</span>
<span id="boxCountDisplay" class="bg-green-600 text-white font-black px-4 py-1 rounded-full text-lg">0</span>
</div>
<button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center gap-2">
<span>📥 Download Current Labels PDF</span>
</button>
</div>

<!-- History Toggle Button -->
<div class="mt-6 text-right">
<button id="toggleHistoryBtn" onclick="toggleHistory()" class="text-xs text-blue-600 hover:underline font-semibold">
📜 Show 20-Day Upload History
</button>
</div>

<!-- History Box -->
<div id="historyBox" class="mt-3 p-4 bg-gray-50 border border-gray-200 rounded-xl text-left hidden">
<div class="flex justify-between items-center mb-2">
<span class="font-bold text-xs text-gray-700">🕒 20-Days Upload History:</span>
<button onclick="clearHistory()" class="text-[10px] text-red-500 hover:underline">Clear History</button>
</div>
<ul id="historyList" class="text-xs space-y-2 max-h-56 overflow-y-auto">
<li class="text-gray-400 italic text-center">No history yet.</li>
</ul>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;
let generatedPdfBlob = null;
let totalBoxesFound = 0;

document.getElementById('excelFile').addEventListener('change', handleFileSelect);

window.onload = function() {
cleanOldHistory();
renderHistory();
};

function norm(str) {
if (str === null || str === undefined) return '';
return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
}

async function handleFileSelect(e) {
const file = e.target.files[0];
if (!file) return;

showStatus("⚡ Processing Excel Data...", "text-blue-600");
const reader = new FileReader();
reader.onload = async function(evt) {
try {
const data = new Uint8Array(evt.target.result);
const workbook = XLSX.read(data, { type: 'array' });
const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
let rawGrid = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
let headerRowIndex = -1;
const headerKeywords = ['merchant', 'sku', 'box', 'item', 'challan', 'invoice', 'qty'];

for (let r = 0; r < Math.min(rawGrid.length, 20); r++) {
const row = rawGrid[r];
if (!row || row.length === 0) continue;
let matchCount = 0;
for (let c = 0; c < row.length; c++) {
const val = norm(row[c]);
if (headerKeywords.some(kw => val.includes(kw))) {
matchCount++;
}
}
if (matchCount >= 2) {
headerRowIndex = r;
break;
}
}

if (headerRowIndex === -1) {
showStatus("❌ Table Header Row not found in Excel!", "text-red-600");
return;
}

let metaPO = '';
let metaDest = '';
for (let r = 0; r < headerRowIndex; r++) {
const row = rawGrid[r];
if (!row) continue;
for (let c = 0; c < row.length; c++) {
const val = String(row[c] || '').trim();
const nVal = norm(val);
if (nVal === 'po' && row[c+1]) {
metaPO = String(row[c+1]).trim();
}
if ((nVal.includes('boxdetail') || nVal.includes('destination') || nVal.includes('shipto')) && row[c+1]) {
metaDest = String(row[c+1]).trim();
}
}
}

const tableData = XLSX.utils.sheet_to_json(firstSheet, { range: headerRowIndex });
if (tableData.length > 0) {
const colsFound = Object.keys(tableData[0]).join(' | ');
document.getElementById('detectedColsText').innerText = colsFound;
document.getElementById('debugBox').classList.remove('hidden');
}

await generatePDF(tableData, metaPO, metaDest, file.name);
} catch (err) {
console.error(err);
showStatus("❌ Error processing file: " + err.message, "text-red-600");
}
};

reader.readAsArrayBuffer(file);
}

function getColValue(row, possibleKeys, defaultValue = '') {
const keys = Object.keys(row);
for (let pk of possibleKeys) {
const normPK = norm(pk);
for (let k of keys) {
if (norm(k) === normPK) {
const v = row[k];
if (v !== undefined && v !== null && String(v).trim() !== '') {
return String(v).trim();
}
}
}
}

for (let pk of possibleKeys) {
const normPK = norm(pk);
for (let k of keys) {
if (norm(k).includes(normPK)) {
const v = row[k];
if (v !== undefined && v !== null && String(v).trim() !== '') {
return String(v).trim();
}
}
}
}

return defaultValue;
}

async function generatePDF(data, metaPO, metaDest, fileName) {
const selectedOrientation = document.querySelector('input[name="pageOrientation"]:checked').value;
const isLandscape = (selectedOrientation === 'l');

const rawGroups = {};
data.forEach(row => {
const boxVal = getColValue(row, ['box count', 'boxcount', 'box no', 'boxno', 'box', 'boxnumber', 'box num'], '');
if (!boxVal) return;
if (!rawGroups[boxVal]) rawGroups[boxVal] = [];
rawGroups[boxVal].push(row);
});

const uniqueRawKeys = Object.keys(rawGroups);
totalBoxesFound = uniqueRawKeys.length;

if (totalBoxesFound === 0) {
showStatus("❌ No Box data found! Check 'BOX NUM' or 'BOX COUNT' column.", "text-red-600");
return;
}

const pageWidth = isLandscape ? 152.4 : 101.6;

const doc = new jsPDF({
orientation: selectedOrientation,
unit: 'mm',
format: [101.6, 152.4]
});

let isFirstPage = true;

// -------------------------------------------------------------
// 1. DYNAMIC COLUMNS DETECTION (Jo Column Excel me hoga wahi dikhega)
// -------------------------------------------------------------
const masterColumns = [
{ header: 'SKU', keys: ['merchant sku', 'merchantsku', 'sku'] },
{ header: 'CODE', keys: ['item code', 'itemcode', 'style', 'code'] },
{ header: 'NAME', keys: ['item name', 'iteam name', 'itemname', 'title', 'item', 'description'] },
{ header: 'COL', keys: ['color', 'colour', 'col'] },
{ header: 'SIZE', keys: ['size'] },
{ header: 'EAN', keys: ['ean code', 'eancode', 'barcode', 'ean'] },
{ header: 'MRP', keys: ['mrp', 'rate', 'price', 'amount', 'rtae'], isMrp: true },
{ header: 'QTY', keys: ['qty', 'quantity', 'boxqty'], isQty: true }
];

// Verify which columns actually contain data in the Excel sheet
const activeCols = masterColumns.filter(col => {
if (col.isQty) return true; // QTY is always required
return data.some(r => {
const val = getColValue(r, col.keys, '');
return val !== '' && val !== '-';
});
});

const activeHeaders = activeCols.map(c => c.header);

for (let rawKey of uniqueRawKeys) {
const boxData = rawGroups[rawKey];
let dest = metaDest;
let po = metaPO;
let inv = '';
let challan = '';

for (let r of boxData) {
if (!dest) dest = getColValue(r, ['destination', 'shipto', 'partyname', 'party', 'customer'], '');
if (!po) po = getColValue(r, ['pono', 'ponumber', 'purchaseorder', 'orderno', 'po'], '');
if (!inv) inv = getColValue(r, ['invoice number', 'invoiceno', 'invno', 'invoice'], '');
if (!challan) challan = getColValue(r, ['challan_no', 'challanno', 'challan'], '');
}

// -------------------------------------------------------------
// 2. DYNAMIC HEADER (Jo Header Data Hoga Wahi Draw Hoga)
// -------------------------------------------------------------
const drawHeader = (docObj) => {
docObj.setLineWidth(0.4);
docObj.setDrawColor(0, 0, 0);
docObj.setTextColor(0, 0, 0);

const boxOuterWidth = pageWidth - 4;
const divX = isLandscape ? 110 : 65;

// Header Lines List (Only include existing data)
const headerItems = [];
if (dest) headerItems.push(`SHIP TO / DEST: ${dest}`);
if (po) headerItems.push(`PO/ORD: ${po}`);
if (challan) headerItems.push(`CHALLAN NO: ${challan}`);
if (inv) headerItems.push(`INV NO: ${inv}`);

// Fallback if empty
if (headerItems.length === 0) {
headerItems.push(`SHIP TO / DEST: SHANTANU MATHURA`);
}

docObj.rect(2, 2, boxOuterWidth, 22); 
docObj.line(divX, 2, divX, 24); 

docObj.setFont("Helvetica", "bold");

// Draw dynamic header lines smoothly
const totalLines = headerItems.length;
const startY = 5.5;
const maxSpace = 17; // Vertical height available
const stepY = totalLines > 1 ? maxSpace / totalLines : 0;

headerItems.forEach((textLine, index) => {
docObj.setFontSize(totalLines > 3 ? 5.8 : 6.5);
let lineText = textLine;
if (!isLandscape && lineText.length > 42) {
lineText = lineText.substring(0, 39) + "...";
}
docObj.text(lineText, 4, startY + (index * stepY));
});

// Box Number Right Section
let displayBoxNum = rawKey.replace(/[^0-9]/g, '') || rawKey;
const boxCenter = divX + (boxOuterWidth + 2 - divX) / 2;

docObj.setFontSize(8.5);
docObj.text("BOX NO.", boxCenter, 8, { align: "center" });

docObj.setFontSize(14);
docObj.text(`${displayBoxNum} / ${totalBoxesFound}`, boxCenter, 16, { align: "center" });
};

// -------------------------------------------------------------
// 3. TABLE DATA PREPARATION
// -------------------------------------------------------------
const tableRows = [];
let totalQty = 0;

boxData.forEach(r => {
const qtyVal = getColValue(r, ['qty', 'quantity', 'boxqty'], '1');
const qty = parseInt(qtyVal) || 1;
totalQty += qty;

const rowData = [];
activeCols.forEach(col => {
if (col.isQty) {
rowData.push(qty);
} else if (col.isMrp) {
let rawMrp = getColValue(r, col.keys, '');
rowData.push(rawMrp.replace(/[^0-9]/g, ''));
} else {
rowData.push(getColValue(r, col.keys, ''));
}
});
tableRows.push(rowData);
});

// Total Box Qty Footer Row
tableRows.push([
{ content: 'TOTAL BOX QTY', colSpan: activeCols.length - 1, styles: { fontStyle: 'bold', halign: 'left', textColor: [0, 0, 0], fontSize: 6, lineWidth: 0.15, lineColor: [0, 0, 0] } },
{ content: String(totalQty), styles: { fontStyle: 'bold', halign: 'center', textColor: [0, 0, 0], fontSize: 6, lineWidth: 0.15, lineColor: [0, 0, 0] } }
]);

if (!isFirstPage) {
doc.addPage([101.6, 152.4], selectedOrientation);
}
isFirstPage = false;

drawHeader(doc);

// Auto Table with Automatic Column Width and Auto Line Break
doc.autoTable({
startY: 25,
margin: { left: 2, right: 2, top: 25, bottom: 5 },
head: [activeHeaders],
body: tableRows,
theme: 'grid',
tableLineWidth: 0.15,
tableLineColor: [0, 0, 0],
headStyles: {
fillColor: [0, 0, 0],
textColor: [255, 255, 255],
fontSize: 5.5,
fontStyle: 'bold',
halign: 'center',
cellPadding: 0.5,
lineWidth: 0.15,
lineColor: [0, 0, 0]
},
bodyStyles: {
fontSize: 4.5,
fontStyle: 'bold',
textColor: [0, 0, 0],
halign: 'center',
valign: 'middle',
cellPadding: 0.5,
overflow: 'linebreak', // Automatic Multi-Line Support
lineWidth: 0.15,
lineColor: [0, 0, 0]
},
didDrawPage: function (data) {
if (data.pageNumber > 1) {
drawHeader(doc);
}
}
});
}

generatedPdfBlob = doc.output('blob');
showStatus("✅ Labels Ready!", "text-green-600");
document.getElementById('boxCountDisplay').innerText = totalBoxesFound;
document.getElementById('resultBox').classList.remove('hidden');
saveToHistory(fileName, totalBoxesFound);
}

document.getElementById('downloadBtn').addEventListener('click', () => {
if (!generatedPdfBlob) return;
const a = document.createElement('a');
a.href = URL.createObjectURL(generatedPdfBlob);
a.download = `ALL_BOX_LABELS_${totalBoxesFound}_UNITS.pdf`;
a.click();
});

function showStatus(msg, colorClass) {
const st = document.getElementById('status');
st.className = `mt-6 text-sm font-semibold ${colorClass}`;
st.innerText = msg;
st.classList.remove('hidden');
}

// --- LIGHTWEIGHT 20-DAY HISTORY SYSTEM ---
function saveToHistory(fileName, boxes) {
try {
let history = JSON.parse(localStorage.getItem('labelHistoryLight') || '[]');
const now = new Date();
const newEntry = {
id: Date.now(),
name: fileName,
boxes: boxes,
time: now.toLocaleString(),
timestamp: now.getTime()
};
history.unshift(newEntry);
localStorage.setItem('labelHistoryLight', JSON.stringify(history));
cleanOldHistory();
renderHistory();
} catch (e) {
localStorage.clear();
}
}

function cleanOldHistory() {
let history = JSON.parse(localStorage.getItem('labelHistoryLight') || '[]');
const twentyDaysInMs = 20 * 24 * 60 * 60 * 1000;
const now = new Date().getTime();
const validHistory = history.filter(item => (now - item.timestamp) < twentyDaysInMs);
localStorage.setItem('labelHistoryLight', JSON.stringify(validHistory));
}

function renderHistory() {
const history = JSON.parse(localStorage.getItem('labelHistoryLight') || '[]');
const historyList = document.getElementById('historyList');
if (history.length === 0) {
historyList.innerHTML = `<li class="text-gray-400 italic text-center">No history in the last 20 days.</li>`;
return;
}
historyList.innerHTML = history.map((item, index) => `
<li class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm">
<div>
<div class="font-bold text-gray-800 text-[11px]">${index + 1}. ${item.name}</div>
<div class="text-[9px] text-gray-400">${item.time}</div>
</div>
<span class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full text-[10px]">${item.boxes} Boxes</span>
</li>`).join('');
}

function toggleHistory() {
const box = document.getElementById('historyBox');
box.classList.toggle('hidden');
}

function clearHistory() {
if (confirm("Are you sure you want to clear all history?")) {
localStorage.removeItem('labelHistoryLight');
renderHistory();
}
}
</script>
</body>
</html>
